       <div class="hstack" style="margin-top:12px">${FS.mode === 'demo' ? '<button class="btn pri" data-act="connect">Connect the real shared folder</button><button class="btn" data-act="demo-reset">Reset sample data</button>' : '<button class="btn" data-act="connect">Change folder</button><button class="btn" data-act="pack">Compact old months</button>'}<button class="btn ghost" data-act="disconnect">Disconnect</button></div>`
    : `<div class="dim" style="font-size:12px;margin-bottom:10px">Not connected.</div><div class="hstack"><button class="btn pri" data-act="connect">Choose shared folder</button>${FS.status === 'needs-permission' ? '<button class="btn" data-act="reconnect">Reconnect</button>' : ''}</div>`;
  return `<div class="th rise" style="--pen:var(--ink-2)"><div><div class="no">06 · SETTINGS</div><h1>Settings <span>you, the folder, the landscape</span></h1></div></div>
  <div class="g g2">
    <div class="stack">
      ${unit('You', `<div class="frm"><label class="field"><span class="k">SAP user ID</span><input class="inp" id="meId" value="${esc(who?.id || '')}" placeholder="e.g. AGOVILKAR" style="text-transform:uppercase"></label><label class="field"><span class="k">Name shown to the team</span><input class="inp sans" id="meName" value="${esc(who?.name || '')}" placeholder="e.g. Aditya G."></label></div><div class="hstack" style="margin-top:12px"><button class="btn pri" data-act="save-me">Save</button><span class="dim" style="font-size:11px">Stored only in this browser. Every save you make is signed with it.</span></div>`, { p: 'pen-2' })}
      ${unit('Shared folder', folderBody, { p: 'pen-3' })}
      ${unit('Appearance', `<div class="chips">${[['system', 'Follow Windows'], ['paper', 'Paper (light)'], ['backlit', 'Backlit (dark)']].map(([k, l]) => `<button class="chip ${theme === k ? 'on' : ''}" data-act="theme" data-t="${k}">${l}</button>`).join('')}</div>`, { p: 'ink-2' })}
      ${unit('Backup &amp; export', `<div class="hstack"><button class="btn" data-act="export-json" ${canWrite() ? '' : 'disabled'}>Download full backup (.json)</button><button class="btn" data-act="export-occ" ${canWrite() ? '' : 'disabled'}>Incidents (.csv)</button><button class="btn" data-act="export-read" ${canWrite() ? '' : 'disabled'}>Readings (.csv)</button><button class="btn" data-act="export-kb" ${canWrite() ? '' : 'disabled'}>Knowledge base (.csv)</button></div><div class="note"><span class="ring"></span><span>The backup holds every save ever made, so the whole history can be rebuilt from it.</span></div>`, { p: 'ink-2' })}
    </div>
    <div class="stack">
      ${unit('Systems &amp; clients you monitor', canWrite() ? (sys.length ? `<table class="tbl"><thead><tr><th>System / client</th><th>Description</th><th>Type</th><th></th></tr></thead><tbody>${sys.map(x => `<tr class="link" data-act="edit-sys" data-key="${esc(x.key)}"><td class="nm">${esc(x.key)}</td><td>${esc(x.label)}</td><td class="mono" style="font-size:11px">${esc(x.env)}</td><td>${x.retired ? '<span class="dim">retired</span>' : ''}</td></tr>`).join('')}</tbody></table>` : emptyState('No systems yet', 'One row per system/client combination in the monitoring email.')) + `<div class="hstack" style="margin-top:12px"><button class="btn pri" data-act="add-sys" ${canWrite() ? '' : 'disabled'}>Add a system</button></div>` : '<div class="dim" style="font-size:12px">Connect the folder first.</div>', { p: 'pen-6', meta: `${sys.filter(x => !x.retired).length} active` })}
      ${unit('How saving works', `<div style="font-size:12px;line-height:1.65;color:var(--ink-2);display:grid;gap:8px">
        <div><b style="color:var(--ink)">Nothing is overwritten.</b> Each save is a new small file in <span class="mono">events/&lt;month&gt;/</span>, named with the time and your ID. Two people saving at the same moment create two different files, so OneDrive never has to choose between them and never makes “conflict copies”.</div>
        <div><b style="color:var(--ink)">Everyone sees the same picture.</b> The tool replays every save in time order. It checks the folder for new saves every 15 seconds and when you come back to the window.</div>
        <div><b style="color:var(--ink)">Soft locks.</b> Opening an entry or a day's readings for editing writes a small lock note in <span class="mono">locks/</span>. Others see “<i>Priya is editing</i>” and are warned before they start. Locks expire after 3 minutes without a heartbeat, so a closed laptop never blocks anyone.</div>
        <div><b style="color:var(--ink)">Clashes are caught, not lost.</b> If someone saved the same field while you were editing, you're shown their version and choose. If OneDrive delivers two simultaneous saves later, the entry shows both versions until someone picks one.</div>
        <div><b style="color:var(--ink)">Speed.</b> Each PC keeps a local copy of what it has read, so only new saves are fetched. “Compact old months” bundles finished months into one file so a new colleague's first load is quick.</div></div>`, { p: 'pen-5' })}
    </div>
  </div>`;
}
</script>
<script>
/* ======================================================================
   Modals, toast, palette
   ====================================================================== */
const modalStack = [];
function openModal({ title, sub = '', body, foot, wide = false, onMount, onClose }) {
  const el = document.createElement('div');
  el.className = 'unit modal' + (wide ? ' wide' : '');
  el.style.zIndex = 50 + modalStack.length * 2;
  el.innerHTML = `<div class="mh"><h3>${title}</h3><span class="meta">${sub}</span></div><div class="mbody">${body}</div><div class="err" data-err></div><div class="mfoot">${foot}</div>`;
  document.body.appendChild(el);
  const scrim = $('#scrim'); scrim.classList.add('on'); scrim.style.zIndex = 49 + modalStack.length * 2;
  const m = { el, close() { const i = modalStack.indexOf(m); if (i < 0) return; modalStack.splice(i, 1); el.remove(); if (!modalStack.length) scrim.classList.remove('on'); else scrim.style.zIndex = 49 + (modalStack.length - 1) * 2; onClose?.(); }, err(t) { $('[data-err]', el).textContent = t || ''; } };
  modalStack.push(m);
  onMount?.(el, m);
  setTimeout(() => { const f = el.querySelector('[autofocus]') || el.querySelector('.mbody input:not([type=hidden]),.mbody textarea'); f?.focus(); }, 30);
  return m;
}
$('#scrim').addEventListener('mousedown', () => { if ($('#pal').classList.contains('on')) return; const m = modalStack.at(-1); if (m && !m.el.dataset.sticky) m.el.dispatchEvent(new CustomEvent('dismiss')); });
function ask(title, html, buttons, mount, wide) {
  return new Promise(res => {
    const m = openModal({
      title, body: html, wide, foot: buttons.map((b, i) => `<button class="btn ${b.pri ? 'pri' : ''} ${b.danger ? 'danger' : ''}" data-i="${i}">${esc(b.label)}</button>`).join(''),
      onMount(el) { $$('.mfoot [data-i]', el).forEach(b => b.onclick = () => { m.close(); res(buttons[+b.dataset.i].val); }); el.addEventListener('dismiss', () => { m.close(); res(buttons[0].val); }); mount?.(el); },
    });
  });
}
let toastT = 0;
function toast(msg, bad) { const t = $('#toast'); $('#toastTx').textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), bad ? 5200 : 2800); }
function showLoading(text) {
  let el = $('#loading');
  if (!el) { el = document.createElement('div'); el.id = 'loading'; el.className = 'loading'; el.innerHTML = '<canvas data-ch="spin"></canvas><span></span>'; document.body.appendChild(el); scope($('canvas', el), drawSpinner, { anim: true, intro: false }); }
  $('span', el).textContent = text;
}
function hideLoading() { $('#loading')?.remove(); }

/* identity */
function askIdentity() {
  return new Promise(res => {
    const cur = me();
    const m = openModal({
      title: 'Who are you?', sub: 'shown on everything you save',
      body: `<div class="frm"><label class="field"><span class="k">SAP user ID <b>*</b></span><input class="inp" id="idId" value="${esc(cur?.id || '')}" placeholder="e.g. AGOVILKAR" style="text-transform:uppercase" autofocus></label><label class="field"><span class="k">Name <b>*</b></span><input class="inp sans" id="idName" value="${esc(cur?.name || '')}" placeholder="e.g. Aditya G."></label></div><div class="dim" style="font-size:11px;line-height:1.5">Kept only in this browser. Your colleagues see it next to the entries and incidents you add.</div>`,
      foot: `<button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Save</button>`,
      onMount(el) {
        const ok = () => { const id = $('#idId', el).value.trim().toUpperCase(), name = $('#idName', el).value.trim(); if (!id || !name) return m.err('Both are needed.'); store.set('me', { id, name }); m.close(); paintChrome(); res(true); };
        $('[data-ok]', el).onclick = ok; $('[data-x]', el).onclick = () => { m.close(); res(false); };
        el.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
        el.addEventListener('dismiss', () => { m.close(); res(false); });
      },
    });
  });
}

/* ------------------------------------------------------------- shared form bits */
function sysPicker(selected = [], { allLabel = '' } = {}) {
  const sys = sysList();
  return `<div class="chips" data-syspick>${allLabel ? `<span class="dim" style="font-size:10.5px;align-self:center">${allLabel}</span>` : ''}${sys.map(x => `<button type="button" class="chip ${selected.includes(x.key) ? 'on' : ''}" data-sys="${esc(x.key)}" title="${esc(x.label)}">${esc(x.key)}</button>`).join('') || '<span class="dim" style="font-size:11px">No systems set up yet (Settings).</span>'}</div>`;
}
function wireSysPicker(el) { $$('[data-syspick] [data-sys]', el).forEach(b => b.onclick = () => b.classList.toggle('on')); }
const readSysPicker = el => $$('[data-syspick] [data-sys].on', el).map(b => b.dataset.sys);
function winEditor(w) {
  w = w || { type: 'any' };
  return `<div class="field full" data-win><span class="k">When it happens</span>
    <div class="hstack">
      <select class="inp" data-w="type" style="width:auto">${[['any', 'Any day'], ['dom', 'Days of the month…'], ['end', 'Last days of the month'], ['start', 'First days of the month'], ['wd', 'Certain weekdays']].map(([k, l]) => `<option value="${k}" ${(w.type || 'any') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span data-wp="dom" class="hstack">from <input class="inp" data-w="from" style="width:60px" value="${w.type === 'dom' ? w.from || 1 : 20}" inputmode="numeric"> to <input class="inp" data-w="to" style="width:90px" value="${w.type === 'dom' ? (w.to === 'end' || !w.to ? 'end' : w.to) : 'end'}" placeholder="end"></span>
      <span data-wp="end start" class="hstack"><input class="inp" data-w="n" style="width:60px" value="${w.n || 3}" inputmode="numeric"> days</span>
      <span data-wp="wd" class="chips">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" class="chip ${(w.days || []).includes(d) ? 'on' : ''}" data-wd="${d}">${DOW[d]}</button>`).join('')}</span>
    </div>
    <div class="hstack" style="margin-top:4px"><span class="dim" style="font-size:10.5px">Only in:</span><span class="chips">${MON.map((m, i) => `<button type="button" class="chip ${(w.months || []).includes(i + 1) ? 'on' : ''}" data-mo="${i + 1}" style="height:20px;padding:0 6px;font-size:9.5px">${m}</button>`).join('')}</span></div>
    <span class="hint" data-wprev></span></div>`;
}
function wireWinEditor(el) {
  const box = $('[data-win]', el); if (!box) return;
  const sync = () => {
    const t = $('[data-w=type]', box).value;
    $$('[data-wp]', box).forEach(s => s.hidden = !s.dataset.wp.split(' ').includes(t));
    const w = readWin(el), td = today();
    $('[data-wprev]', box).innerHTML = `${esc(winText(w))} — ${winMatch(w, td) ? '<span style="color:var(--good)">includes today</span>' : '<span>does not include today</span>'} (${esc(fmtD(td))})`;
  };
  $$('[data-wd],[data-mo]', box).forEach(b => b.onclick = () => { b.classList.toggle('on'); sync(); });
  box.addEventListener('input', sync); box.addEventListener('change', sync); sync();
}
function readWin(el) {
  const box = $('[data-win]', el); const t = $('[data-w=type]', box).value;
  const months = $$('[data-mo].on', box).map(b => +b.dataset.mo);
  let w = { type: t };
  if (t === 'dom') { const to = $('[data-w=to]', box).value.trim().toLowerCase(); w.from = clamp(parseInt($('[data-w=from]', box).value) || 1, 1, 31); w.to = !to || to === 'end' || +to >= 31 ? 'end' : clamp(parseInt(to) || 31, 1, 31); }
  if (t === 'end' || t === 'start') w.n = clamp(parseInt($('[data-w=n]', box).value) || 3, 1, 15);
  if (t === 'wd') w.days = $$('[data-wd].on', box).map(b => +b.dataset.wd);
  if (months.length) w.months = months;
  return winIsAny(w) ? null : w;
}
function actionPick(cur = 'monitor') {
  return `<div class="field full"><span class="k">What to do when this is the cause</span><div class="chips" data-actpick>${Object.entries(ACTIONS).map(([k, a]) => `<button type="button" class="chip ${cur === k ? 'on' : ''}" data-a="${k}" style="--pen:${pen(a.pen)}"><i></i>${esc(a.label)}</button>`).join('')}</div></div>`;
}
function wireActionPick(el) { $$('[data-actpick] [data-a]', el).forEach(b => b.onclick = () => $$('[data-actpick] [data-a]', el).forEach(x => x.classList.toggle('on', x === b))); }
const readAction = el => $('[data-actpick] [data-a].on', el)?.dataset.a || 'monitor';

/* ------------------------------------------------------------- entry modal */
async function entryModal(e, preset = {}) {
  const isNew = !e;
  const target = e ? 'entry:' + e.id : null;
  if (e && !(await acquireLock(target, e.name))) return;
  const v = e || { kind: preset.kind || 'job', name: preset.name || '', title: '', systems: [], area: '', owner: '', crit: 'normal', desc: '', tags: [], contact: '' };
  const base = e ? { ...e.rev } : {};
  return new Promise(res => {
    const m = openModal({
      title: isNew ? 'New knowledge entry' : 'Edit ' + esc(e.name), sub: isNew ? 'a job, dump or other recurring problem' : lockBadge(target), wide: true,
      body: `<div class="frm">
        <div class="field full"><span class="k">Type</span><div class="chips" data-kind>${Object.entries(KINDS).map(([k, x]) => `<button type="button" class="chip ${v.kind === k ? 'on' : ''}" data-k="${k}" style="--pen:${pen(x.pen)}"><i></i>${esc(x.long)}</button>`).join('')}</div></div>
        <label class="field"><span class="k">Name <b>*</b></span><input class="inp" id="eName" value="${esc(v.name)}" placeholder="${v.kind === 'dump' ? 'e.g. TSV_TNEW_PAGE_ALLOC_FAILED' : 'e.g. ZJOB_ITALY1'}" style="text-transform:uppercase;font-weight:600" autofocus><span class="hint" id="eDup"></span></label>
        <label class="field"><span class="k">Short description</span><input class="inp sans" id="eTitle" value="${esc(v.title)}" placeholder="e.g. Italy payroll posting to FI"></label>
        <div class="field full"><span class="k">Runs on / seen on</span>${sysPicker(v.systems || [])}</div>
        <label class="field"><span class="k">Area / module</span><input class="inp sans" id="eArea" value="${esc(v.area)}" placeholder="e.g. HR Payroll, FI, SD, Interfaces"></label>
        <label class="field"><span class="k">Criticality</span><select class="inp" id="eCrit">${Object.entries(CRIT).map(([k, l]) => `<option value="${k}" ${v.crit === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field"><span class="k">Owner (team or person)</span><input class="inp sans" id="eOwner" value="${esc(v.owner)}" placeholder="e.g. HR functional team"></label>
        <label class="field"><span class="k">Escalate to</span><input class="inp sans" id="eContact" value="${esc(v.contact)}" placeholder="e.g. Basis on-call, team lead"></label>
        <label class="field full"><span class="k">Notes — what it does, anything the next person should know</span><textarea class="inp" id="eDesc" rows="4" placeholder="What the job does, when it's scheduled, who depends on it…">${esc(v.desc)}</textarea></label>
        <label class="field full"><span class="k">Tags (comma separated)</span><input class="inp sans" id="eTags" value="${esc((v.tags || []).join(', '))}" placeholder="e.g. payroll, month-end, italy"></label>
      </div>`,
      foot: `<span class="l">${isNew ? 'You can add known causes right after.' : 'Only changed fields are saved.'}</span><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>${isNew ? 'Create entry' : 'Save changes'}</button>`,
      onMount(el) {
        wireSysPicker(el);
        $$('[data-kind] [data-k]', el).forEach(b => b.onclick = () => $$('[data-kind] [data-k]', el).forEach(x => x.classList.toggle('on', x === b)));
        const dupCheck = () => {
          const n = normName($('#eName', el).value), k = $('[data-kind] .on', el)?.dataset.k;
          const hit = liveEntries().find(x => x !== e && normName(x.name) === n && x.kind === k && n);
          $('#eDup', el).innerHTML = hit ? `<span style="color:var(--bad)">Already exists — </span><a href="#entry/${encodeURIComponent(hit.id)}" data-close>open ${esc(hit.name)}</a>` : '';
          $('[data-close]', el)?.addEventListener('click', () => { m.close(); });
        };
        $('#eName', el).addEventListener('input', dupCheck); dupCheck();
        const close = () => { m.close(); if (target) releaseLock(target); res(false); };
        $('[data-x]', el).onclick = close; el.addEventListener('dismiss', close);
        $('[data-ok]', el).onclick = async () => {
          const vals = {
            kind: $('[data-kind] .on', el)?.dataset.k || 'job', name: normName($('#eName', el).value), title: $('#eTitle', el).value.trim(),
            systems: readSysPicker(el), area: $('#eArea', el).value.trim(), owner: $('#eOwner', el).value.trim(), crit: $('#eCrit', el).value,
            contact: $('#eContact', el).value.trim(), desc: $('#eDesc', el).value.trim(), tags: $('#eTags', el).value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean),
          };
          if (!vals.name) return m.err('Give it a name — the job name or the runtime error.');
          if (isNew) {
            const hit = liveEntries().find(x => normName(x.name) === vals.name && x.kind === vals.kind && !x.archived);
            if (hit) return m.err(`${hit.name} already exists. Open it instead of creating a second one.`);
            const id = uid('e');
            if (await emit([{ t: 'entry.create', d: { id, ...vals } }], `Created ${vals.name}`)) { m.close(); go('entry', id); res(id); }
            return;
          }
          const changed = ENTRY_FIELDS.filter(f => !same(vals[f], e[f]));
          if (!changed.length) { close(); return; }
          changed.vals = vals;
          const r = await clashCheck(() => entryOf(S(), e.id), base, changed, (f, x) => f === 'kind' ? KINDS[x]?.label : Array.isArray(x) ? x.join(', ') : String(x ?? ''));
          if (r === null) return;
          const set = {}; for (const f of changed) if (!(r.drop || []).includes(f)) set[f] = vals[f];
          if (!Object.keys(set).length) { close(); return; }
          if (await emit([{ t: 'entry.update', d: { id: e.id, set, base: r.base } }], 'Saved')) { m.close(); releaseLock(target); res(true); }
        };
      },
    });
  });
}

/* ------------------------------------------------------------- cause modal */
async function causeModal(e, c) {
  const isNew = !c, target = 'entry:' + e.id;
  if (!DB.myLocks.has(target) && !(await acquireLock(target, e.name))) return;
  const v = c || { title: '', win: null, systems: [], check: '', action: 'monitor', contact: '', fix: '' };
  const base = c ? { ...c.rev } : {};
  return new Promise(res => {
    const m = openModal({
      title: (isNew ? 'Add a known cause · ' : 'Edit cause · ') + `<span class="mono">${esc(e.name)}</span>`, sub: lockBadge(target), wide: true,
      body: `<div class="frm">
        <label class="field full"><span class="k">The cause, in a line <b>*</b></span><input class="inp sans" id="cTitle" value="${esc(v.title)}" placeholder="e.g. RFC connection to BW failed" autofocus></label>
        ${winEditor(v.win)}
        ${actionPick(v.action)}
        <label class="field full"><span class="k">How to check if this is the cause</span><textarea class="inp" id="cCheck" rows="3" placeholder="e.g. Job log shows “RFC destination BW_PRD not reachable”. Test the destination in SM59.">${esc(v.check)}</textarea></label>
        <label class="field full"><span class="k">Fix / workaround</span><textarea class="inp" id="cFix" rows="2" placeholder="e.g. Ask Basis to restore the connection, then rerun the job.">${esc(v.fix)}</textarea></label>
        <div class="field"><span class="k">Only on these systems (none = all)</span>${sysPicker(v.systems || [])}</div>
        <label class="field"><span class="k">Who to contact</span><input class="inp sans" id="cContact" value="${esc(v.contact)}" placeholder="e.g. Basis team"></label>
      </div>`,
      foot: `<button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>${isNew ? 'Add cause' : 'Save cause'}</button>`,
      onMount(el) {
        wireSysPicker(el); wireWinEditor(el); wireActionPick(el);
        const close = () => { m.close(); releaseLock(target); res(false); };
        $('[data-x]', el).onclick = close; el.addEventListener('dismiss', close);
        $('[data-ok]', el).onclick = async () => {
          const vals = { title: $('#cTitle', el).value.trim(), win: readWin(el), action: readAction(el), check: $('#cCheck', el).value.trim(), fix: $('#cFix', el).value.trim(), systems: readSysPicker(el), contact: $('#cContact', el).value.trim() };
          if (!vals.title) return m.err('Describe the cause in a line.');
          if (isNew) {
            if (await emit([{ t: 'cause.add', d: { entryId: e.id, cause: { id: uid('c'), ...vals } } }], 'Cause added')) { m.close(); releaseLock(target); res(true); }
            return;
          }
          const changed = CAUSE_FIELDS.filter(f => !same(vals[f], c[f]));
          if (!changed.length) { close(); return; }
          changed.vals = vals;
          const r = await clashCheck(() => entryOf(S(), e.id)?.causes.get(c.id), base, changed, (f, x) => f === 'win' ? winText(x) : f === 'action' ? ACTIONS[x]?.label : Array.isArray(x) ? x.join(', ') : String(x ?? ''));
          if (r === null) return;
          const set = {}; for (const f of changed) if (!(r.drop || []).includes(f)) set[f] = vals[f];
          if (!Object.keys(set).length) { close(); return; }
          if (await emit([{ t: 'cause.update', d: { entryId: e.id, causeId: c.id, set, base: r.base } }], 'Cause saved')) { m.close(); releaseLock(target); res(true); }
        };
      },
    });
  });
}

/* ------------------------------------------------------------- log an incident (the morning flow) */
function occModal({ entryId, causeId } = {}) {
  if (!canWrite()) return toast('Connect the shared folder first.', true);
  let ent = entryId ? entryOf(S(), entryId) : null;
  let kind = ent?.kind || 'job', chosen = causeId || '', status = '';
  const m = openModal({
    title: 'Log a failure', sub: esc(fmtD(today())), wide: true,
    body: `<div class="frm">
      <div class="field full"><span class="k">Type</span><div class="chips" data-kind>${Object.entries(KINDS).map(([k, x]) => `<button type="button" class="chip ${kind === k ? 'on' : ''}" data-k="${k}" style="--pen:${pen(x.pen)}"><i></i>${esc(x.long)}</button>`).join('')}</div></div>
      <label class="field full" style="position:relative"><span class="k">Job name / runtime error <b>*</b></span><input class="inp" id="oName" value="${esc(ent?.name || '')}" placeholder="Type to search what the team already knows… e.g. ZJOB_ITALY1" style="text-transform:uppercase;font-weight:600;height:36px;font-size:13px" autocomplete="off" autofocus><div class="sugg" id="oSugg" hidden></div></label>
      <div class="full" id="oKnown"></div>
      <label class="field"><span class="k">System / client <b>*</b></span><select class="inp" id="oSys">${sysList().map(x => `<option value="${esc(x.key)}">${esc(x.key)}${x.label ? ' · ' + esc(x.label) : ''}</option>`).join('')}<option value="">— not system specific —</option></select></label>
      <label class="field"><span class="k">Date</span><input type="date" class="inp" id="oDate" value="${today()}" max="${today()}"></label>
      <div class="field full"><span class="k">Status</span><div class="chips" data-status>${Object.entries(STATUS).map(([k, s]) => `<button type="button" class="chip" data-s="${k}" style="--pen:${pen(s.pen)}"><i></i>${esc(s.label)}</button>`).join('')}</div></div>
      <label class="field full"><span class="k">What you found / did</span><textarea class="inp" id="oNote" rows="3" placeholder="e.g. Job log: RFC BW_PRD timeout at 02:14. Informed Basis, will rerun once fixed."></textarea></label>
      <label class="field"><span class="k">Ticket / mail reference (optional)</span><input class="inp" id="oRef" placeholder="e.g. INC0012345"></label>
      <label class="field"><span class="k">How many times (optional)</span><input class="inp" id="oCount" value="1" inputmode="numeric"></label>
    </div>`,
    foot: `<span class="l" id="oHint"></span><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Save incident</button>`,
    onMount(el) {
      const nameIn = $('#oName', el), sugg = $('#oSugg', el), known = $('#oKnown', el);
      let sel = -1, items = [];
      const setStatus = s => { status = s; $$('[data-status] [data-s]', el).forEach(b => b.classList.toggle('on', b.dataset.s === s)); };
      const paintKnown = () => {
        const n = normName(nameIn.value);
        ent = n ? liveEntries().find(x => normName(x.name) === n && x.kind === kind && !x.archived) || liveEntries().find(x => normName(x.name) === n && !x.archived) : null;
        if (ent && ent.kind !== kind) { kind = ent.kind; $$('[data-kind] [data-k]', el).forEach(x => x.classList.toggle('on', x.dataset.k === kind)); }
        if (!n) { known.innerHTML = ''; $('#oHint', el).textContent = ''; return; }
        const t = $('#oDate', el).value || today(), sys = $('#oSys', el).value;
        if (!ent) {
          known.innerHTML = `<div class="banner" style="--pen:var(--pen-5)"><span class="ic"></span><span><b class="mono">${esc(n)}</b> isn't in the knowledge base yet — it will be created. Describe the cause below if you know it, so the next person benefits.</span><span></span></div>${newCauseForm()}`;
          wireWinEditor(known); wireActionPick(known);
          chosen = '__new'; $('#oHint', el).textContent = 'New entry + incident';
          if (!status) setStatus('open');
          return;
        }
        if (ent.systems?.length && !ent.systems.includes(sys) && ent.systems[0] && !m.sysTouched) { $('#oSys', el).value = ent.systems[0]; }
        const live = [...ent.causes.values()].filter(c => !c.retired).sort((a, b) => (winMatch(b.win, t) - winMatch(a.win, t)) || b.seen - a.seen);
        const opts = live.map(c => {
          const fits = winMatch(c.win, t) && (!c.systems?.length || !sys || c.systems.includes(sys));
          const why = !winMatch(c.win, t) ? `not on the ${ord(domOf(t))}` : (c.systems?.length && sys && !c.systems.includes(sys)) ? `not on ${sys}` : '';
          return `<button type="button" class="opt ${chosen === c.id ? 'on' : ''}" data-c="${esc(c.id)}" style="${fits ? '' : 'opacity:.6'}"><span class="rd"></span><span><span class="ot">${esc(c.title)} ${!winIsAny(c.win) || c.systems?.length ? (fits ? '<span class="today-tag yes">fits today</span>' : `<span class="today-tag no">${esc(why)}</span>`) : ''} <span class="chip" style="height:18px;--pen:${pen(ACTIONS[c.action]?.pen)}"><i></i>${esc(ACTIONS[c.action]?.short)}</span></span><span class="os">${esc(winText(c.win))}${c.check ? ' · Check: ' + esc(c.check.slice(0, 160)) + (c.check.length > 160 ? '…' : '') : ''} · seen ${c.seen}×</span></span></button>`;
        }).join('');
        known.innerHTML = `<div class="field"><span class="k">What caused it? · ${live.length} known cause${live.length === 1 ? '' : 's'} for ${esc(ent.name)} — <a href="#entry/${encodeURIComponent(ent.id)}" data-open>open entry</a></span>
          <div class="pick">${opts}
            <button type="button" class="opt ${chosen === '__new' ? 'on' : ''}" data-c="__new"><span class="rd"></span><span><span class="ot">Something new — add it as a cause</span><span class="os">The next person will see it in the list above.</span></span></button>
            <button type="button" class="opt ${chosen === '' ? 'on' : ''}" data-c=""><span class="rd"></span><span><span class="ot">Not sure yet</span><span class="os">Log it now as investigating; set the cause later.</span></span></button>
          </div></div><div id="oNewCause" ${chosen === '__new' ? '' : 'hidden'}>${newCauseForm()}</div>`;
        $('[data-open]', known).onclick = () => m.close();
        wireWinEditor(known); wireActionPick(known);
        $$('.pick [data-c]', known).forEach(b => b.onclick = () => {
          chosen = b.dataset.c; $$('.pick [data-c]', known).forEach(x => x.classList.toggle('on', x === b)); $('#oNewCause', known).hidden = chosen !== '__new';
          const c = ent.causes.get(chosen);
          if (c && !m.statusTouched) setStatus(c.action === 'ignore' ? 'ignored' : c.action === 'escalate' || c.action === 'team' ? 'escalated' : c.action === 'monitor' ? 'open' : 'resolved');
          if (!chosen && !m.statusTouched) setStatus('open');
          if (chosen === '__new') $('#ncTitle', known)?.focus();
        });
        $('#oHint', el).textContent = `${ent.occs.length} earlier incident${ent.occs.length === 1 ? '' : 's'}${ent.lastSeen ? ' · last ' + fmtShort(ent.lastSeen) : ''}`;
        if (!status) setStatus(chosen && ent.causes.get(chosen) ? (ent.causes.get(chosen).action === 'ignore' ? 'ignored' : 'open') : 'open');
      };
      const newCauseForm = () => `<div class="frm" style="margin-top:4px;padding:12px;border:1px dashed var(--rule-strong);border-radius:var(--r)"><label class="field full"><span class="k">The cause, in a line</span><input class="inp sans" id="ncTitle" placeholder="e.g. RFC connection to BW failed"></label>${winEditor(null)}${actionPick('monitor')}<label class="field full"><span class="k">How to check if this is the cause</span><textarea class="inp" id="ncCheck" rows="2" placeholder="What should the next person look at to confirm it?"></textarea></label></div>`;
      const showSugg = () => {
        const q = nameIn.value.trim().toLowerCase();
        items = q ? liveEntries().filter(x => !x.archived && (x.name.toLowerCase().includes(q) || x.title.toLowerCase().includes(q))).sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || b.occs.length - a.occs.length).slice(0, 8) : [];
        if (items.length === 1 && normName(items[0].name) === normName(q)) items = [];
        sel = -1;
        sugg.hidden = !items.length;
        sugg.innerHTML = items.map((x, i) => `<div data-i="${i}">${kindBadge(x.kind)} <b class="mono">${esc(x.name)}</b> <span class="dim" style="font-size:11px">${esc(x.title)}</span><span class="sp"></span><span class="dim mono" style="font-size:10px">${x.causes.size} causes</span></div>`).join('');
        $$('[data-i]', sugg).forEach(d => d.onmousedown = ev => { ev.preventDefault(); pickSugg(+d.dataset.i); });
      };
      const pickSugg = i => { const x = items[i]; if (!x) return; nameIn.value = x.name; kind = x.kind; $$('[data-kind] [data-k]', el).forEach(b => b.classList.toggle('on', b.dataset.k === kind)); sugg.hidden = true; chosen = ''; status = ''; paintKnown(); };
      nameIn.addEventListener('input', () => { chosen = ''; showSugg(); paintKnown(); });
      nameIn.addEventListener('keydown', ev => {
        if (sugg.hidden) return;
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); sel = (sel + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; $$('[data-i]', sugg).forEach((d, i) => d.classList.toggle('sel', i === sel)); }
        if (ev.key === 'Enter' && sel >= 0) { ev.preventDefault(); pickSugg(sel); }
        if (ev.key === 'Escape') { ev.stopPropagation(); sugg.hidden = true; }
      });
      nameIn.addEventListener('blur', () => setTimeout(() => sugg.hidden = true, 120));
      $$('[data-kind] [data-k]', el).forEach(b => b.onclick = () => { kind = b.dataset.k; $$('[data-kind] [data-k]', el).forEach(x => x.classList.toggle('on', x === b)); paintKnown(); });
      $$('[data-status] [data-s]', el).forEach(b => b.onclick = () => { m.statusTouched = true; setStatus(b.dataset.s); });
      $('#oSys', el).addEventListener('change', () => { m.sysTouched = true; paintKnown(); });
      $('#oDate', el).addEventListener('change', paintKnown);
      if (ent?.systems?.[0]) $('#oSys', el).value = ent.systems[0];
      paintKnown();
      if (ent) setTimeout(() => $('#oNote', el).focus(), 40);
      const close = () => m.close();
      $('[data-x]', el).onclick = close; el.addEventListener('dismiss', close);
      $('[data-ok]', el).onclick = async () => {
        const name = normName(nameIn.value);
        if (!name) return m.err('Which job or dump failed?');
        const sys = $('#oSys', el).value, date = $('#oDate', el).value || today();
        const ops = [];
        let eid = ent?.id;
        if (!ent) { eid = uid('e'); ops.push({ t: 'entry.create', d: { id: eid, kind, name, title: '', systems: sys ? [sys] : [], area: '', owner: '', crit: 'normal', desc: '', tags: [], contact: '' } }); }
        else if (sys && !ent.systems.includes(sys)) ops.push({ t: 'entry.update', d: { id: eid, set: { systems: [...ent.systems, sys] }, base: { systems: ent.rev.systems } } });
        let cid = chosen === '__new' ? '' : chosen;
        if (chosen === '__new') {
          const title = $('#ncTitle', el)?.value.trim();
          if (title) { cid = uid('c'); ops.push({ t: 'cause.add', d: { entryId: eid, cause: { id: cid, title, win: readWin($('#oNewCause', el) || known), action: readAction(known), check: $('#ncCheck', el).value.trim(), fix: '', systems: [], contact: '' } } }); }
          else if (ent) return m.err('Describe the new cause in a line, or pick “Not sure yet”.');
        }
        ops.push({ t: 'occ.add', d: { id: uid('o'), entryId: eid, date, sys, causeId: cid, status: status || 'open', note: $('#oNote', el).value.trim(), ref: $('#oRef', el).value.trim(), count: Math.max(1, parseInt($('#oCount', el).value) || 1) } });
        if (await emit(ops, `Logged ${name}`)) { m.close(); if (UI.view !== 'entry' || UI.entry !== eid) go('entry', eid); }
      };
    },
  });
}

/* incident details: follow up, change status/cause, add an update */
function occDetail(id) {
  const o = S().occs.get(id); if (!o) return;
  const e = entryOf(S(), o.entryId); if (!e) return;
  const live = [...e.causes.values()].filter(c => !c.retired || c.id === o.causeId);
  const m = openModal({
    title: `${kindBadge(e.kind)} <span class="mono">${esc(e.name)}</span> · ${esc(o.sys || '—')}`, sub: esc(fmtD(o.date) + ' ' + o.date.slice(0, 4)), wide: true,
    body: `<div class="frm">
      <div class="field"><span class="k">Logged</span><div>${whoLine(o.by, o.at)}${o.ref ? ` · <span class="mono">${esc(o.ref)}</span>` : ''}${o.count > 1 ? ` · ×${o.count}` : ''}</div></div>
      <div class="field"><span class="k">Cause</span><select class="inp" id="dCause"><option value="">Not identified yet</option>${live.map(c => `<option value="${esc(c.id)}" ${o.causeId === c.id ? 'selected' : ''}>${esc(c.title)} — ${esc(ACTIONS[c.action]?.short)}</option>`).join('')}</select></div>
      <div class="field full"><span class="k">Status</span><div class="chips" data-status>${Object.entries(STATUS).map(([k, s]) => `<button type="button" class="chip ${o.status === k ? 'on' : ''}" data-s="${k}" style="--pen:${pen(s.pen)}"><i></i>${esc(s.label)}</button>`).join('')}</div></div>
      ${o.note ? `<div class="field full"><span class="k">What was found</span><div class="desc">${esc(o.note)}</div></div>` : ''}
      ${o.log.length ? `<div class="field full"><span class="k">Updates</span><div class="thread">${o.log.map(l => `<div class="msg"><span class="av">${esc(initials(l.by.name))}</span><div><div class="mh"><b>${esc(l.by.name)}</b>${esc(rel(l.at))}${l.status ? ' · → ' + esc(STATUS[l.status]?.label) : ''}</div>${l.text ? `<div class="mt2">${esc(l.text)}</div>` : ''}</div></div>`).join('')}</div></div>` : ''}
      <label class="field full"><span class="k">Add an update</span><textarea class="inp" id="dComment" rows="2" placeholder="e.g. Basis restored the RFC at 10:20, job rerun OK."></textarea></label>
    </div>`,
    foot: `<button class="btn ghost danger" data-void>Remove (logged by mistake)</button><button class="btn ghost" data-copy>Copy for email</button><span class="sp" style="flex:1"></span><button class="btn" data-x>Close</button><button class="btn pri" data-ok>Save</button>`,
    onMount(el) {
      let status = o.status;
      $$('[data-status] [data-s]', el).forEach(b => b.onclick = () => { status = b.dataset.s; $$('[data-status] [data-s]', el).forEach(x => x.classList.toggle('on', x === b)); });
      $('[data-x]', el).onclick = () => m.close(); el.addEventListener('dismiss', () => m.close());
      $('[data-copy]', el).onclick = () => copyText(occText(o), 'Copied — paste it into your mail');
      $('[data-void]', el).onclick = async () => { if (await ask('Remove this incident?', '<p style="margin:0;font-size:12.5px">It disappears from the log and the counts. The save history still records that it was removed and by whom.</p>', [{ label: 'Keep it', val: false }, { label: 'Remove', val: true, danger: true }])) { if (await emit([{ t: 'occ.void', d: { id: o.id, void: true } }], 'Incident removed')) m.close(); } };
      $('[data-ok]', el).onclick = async () => {
        const set = {}, cmt = $('#dComment', el).value.trim(), cause = $('#dCause', el).value;
        if (status !== o.status) set.status = status;
        if (cause !== o.causeId) set.causeId = cause;
        if (!Object.keys(set).length && !cmt) { m.close(); return; }
        if (await emit([{ t: 'occ.update', d: { id: o.id, set, comment: cmt } }], 'Incident updated')) m.close();
      };
    },
  });
}

      <label class="field"><span class="k">Client <b>*</b></span><input class="inp" id="sCl" value="${esc(x?.client || '')}" placeholder="e.g. 100" ${x ? 'disabled' : ''}></label>

      $('[data-ok]', el).onclick = async () => {

/* ------------------------------------------------------------- readings save */
async function saveReadings() {
  const tbl = $('#rgrid'); if (!tbl) return;
  const date = tbl.dataset.date;
  const rows = [];
  let bad = false;
  for (const tr of $$('tr[data-sys]', tbl)) {
    const k = tr.dataset.sys, cur = S().readings.get(date + '|' + k);
    const num = inp => { const v = inp.value.trim(); if (v === '') return null; const n = Number(v); if (!Number.isInteger(n) || n < 0) { inp.classList.add('bad'); bad = true; return null; } inp.classList.remove('bad'); return n; };
    const failed = num($('[data-k=failed]', tr)), dumps = num($('[data-k=dumps]', tr)), note = $('[data-k=note]', tr).value.trim();
    if (failed === (cur?.failed ?? null) && dumps === (cur?.dumps ?? null) && note === (cur?.note || '')) continue;
    if (failed === null && dumps === null && !note && !cur) continue;
    rows.push({ sys: k, failed, dumps, note, base: tr.dataset.rev || '' });
  }
  if (bad) return toast('Use whole numbers (or leave blank).', true);
  if (!rows.length) return toast('Nothing changed.');
  await poll();
  const clashes = rows.filter(r => { const cur = S().readings.get(date + '|' + r.sys); return cur && cur.rev !== r.base && cur.by.id !== me()?.id && (cur.failed !== r.failed || cur.dumps !== r.dumps); });
  if (clashes.length) {
    const pick = {};
    const ok = await ask('Someone saved readings for this day meanwhile', `<div style="display:grid;gap:10px">${clashes.map(r => { const cur = S().readings.get(date + '|' + r.sys); pick[r.sys] = 'mine'; return `<div class="conflict" data-s="${esc(r.sys)}"><div><b class="mono">${esc(r.sys)}</b> — <b>${esc(cur.by.name)}</b> saved at ${hhmm(cur.at)}.</div><div class="pick"><button class="opt on" data-v="mine"><span class="rd"></span><span><span class="ot">Mine: ${r.failed ?? '–'} failed · ${r.dumps ?? '–'} dumps</span></span></button><button class="opt" data-v="theirs"><span class="rd"></span><span><span class="ot">Theirs: ${cur.failed ?? '–'} failed · ${cur.dumps ?? '–'} dumps</span></span></button></div></div>`; }).join('')}</div>`,
      [{ label: 'Cancel', val: false }, { label: 'Save', val: true, pri: true }],
      el => $$('.conflict', el).forEach(c => $$('.opt', c).forEach(b => b.onclick = () => { $$('.opt', c).forEach(x => x.classList.toggle('on', x === b)); pick[c.dataset.s] = b.dataset.v; })));
    if (!ok) return;
    for (const r of clashes) { const cur = S().readings.get(date + '|' + r.sys); if (pick[r.sys] === 'theirs') r.drop = true; r.base = cur.rev; }
  }
  const final = rows.filter(r => !r.drop);
  const clearDraft = () => { for (const k of Object.keys(UI.draft || {})) if (k.startsWith(date + '|')) delete UI.draft[k]; };
  for (const r of rows) if (r.drop) delete UI.draft?.[date + '|' + r.sys];
  if (!final.length) { clearDraft(); render(false); return; }
  if (await emit([{ t: 'reading.batch', d: { date, rows: final } }], `Saved readings for ${fmtD(date)}`)) {
    clearDraft(); releaseLock('readings:' + date);
    const hi = final.filter(r => readingFlag(r.sys, 'dumps', date, r.dumps).k === 'hi' || readingFlag(r.sys, 'failed', date, r.failed).k === 'hi');
    if (hi.length) setTimeout(() => toast(`Above normal on ${hi.map(r => r.sys).join(', ')} — worth a look`, true), 900);
  }
}

/* ------------------------------------------------------------- text exports */
function copyText(t, msg = 'Copied') {
  (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast(msg)).catch(() => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg);
  });
}
function occText(o) {
  const e = entryOf(S(), o.entryId), c = e.causes.get(o.causeId);
  return [`${KINDS[e.kind].label}: ${e.name}${e.title ? ' — ' + e.title : ''}`, `System: ${o.sys || '—'}   Date: ${fmtDY(o.date)}`, `Status: ${STATUS[o.status]?.label}`,
    `Cause: ${c ? c.title : 'not identified yet'}`, c ? `Action: ${ACTIONS[c.action]?.label}${c.contact ? ' (' + c.contact + ')' : ''}` : '', o.note ? `Findings: ${o.note}` : '', o.ref ? `Ref: ${o.ref}` : '',
    ...o.log.filter(l => l.text).map(l => `Update ${fmtShort(isoLocalDate(l.at))} ${hhmm(l.at)} (${l.by.name}): ${l.text}`), `Logged by ${o.by.name}`].filter(Boolean).join('\n');
}
function summaryText(date = today()) {
  const lines = [`Job monitoring — ${fmtD(date)} ${date.slice(0, 4)}`, ''];
  for (const x of sysList()) {
    const r = S().readings.get(date + '|' + x.key);
    if (!r) { lines.push(`${x.key}${x.label ? ' (' + x.label + ')' : ''}: not checked`); continue; }
    const fF = readingFlag(x.key, 'failed', date, r.failed), fD = readingFlag(x.key, 'dumps', date, r.dumps);
    lines.push(`${x.key}${x.label ? ' (' + x.label + ')' : ''}: ${r.failed ?? '–'} failed jobs${fF.k === 'hi' ? ' ▲ (usually ~' + Math.round(fF.ex.med) + ')' : ''}, ${r.dumps ?? '–'} dumps${fD.k === 'hi' ? ' ▲ (usually ~' + Math.round(fD.ex.med) + ')' : ''}${r.note ? ' — ' + r.note : ''}`);
  }
  const occ = [...S().occs.values()].filter(o => !o.void && o.date === date && entryOf(S(), o.entryId));

/* keyboard */
document.addEventListener('keydown', ev => {
  const k = ev.key, typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'k') { ev.preventDefault(); $('#pal').classList.contains('on') ? closePalette() : openPalette(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 's') { ev.preventDefault(); if (modalStack.length) $('[data-ok]', modalStack.at(-1).el)?.click(); else if (UI.view === 'log') saveReadings(); return; }
  if (k === 'Escape') { if ($('#pal').classList.contains('on')) { closePalette(); return; } const m = modalStack.at(-1); if (m) { m.el.dispatchEvent(new CustomEvent('dismiss')); return; } }
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey || modalStack.length || $('#pal').classList.contains('on') || !canWrite()) return;
  const lk = k.toLowerCase();
  if (lk === 'l') { ev.preventDefault(); occModal(UI.view === 'entry' ? { entryId: UI.entry } : {}); }
  else if (lk === 'r') { ev.preventDefault(); ACT['go-log'](); }
  else if (lk === 'n') { ev.preventDefault(); entryModal(null); }
  else if (k === '/') { ev.preventDefault(); openPalette(); }
  else if (/^[1-6]$/.test(k)) go(VIEWS[+k - 1]);
});
addEventListener('focus', () => poll());
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

function cycleTheme() { const order = ['system', 'paper', 'backlit'], t = store.get('theme', 'system'); store.set('theme', order[(order.indexOf(t) + 1) % 3]); applyTheme(); render(false); toast('Theme: ' + { system: 'follow Windows', paper: 'Paper', backlit: 'Backlit' }[store.get('theme')]); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (store.get('theme', 'system') === 'system') { applyTheme(); render(false); } });

/* ------------------------------------------------------------- connecting */
async function openRoot(h, mode, { fresh = false } = {}) {
  clearInterval(pollTimer);
  if (mode === 'folder' && me()?.id === 'YOU') store.set('me', null); /* the sample-data identity must never sign real saves */
  FS.root = h; FS.mode = mode; FS.name = mode === 'demo' ? 'Sample data' : h.name; FS.status = 'loading'; FS.error = '';
  DB.evs.clear(); DB.files.clear(); DB.locks.clear(); DB.myLocks.clear(); DB.S = null;
  render();
  let marker;
  try { marker = (await readJson(h, 'monitoring-desk.json')).data; }
  catch (err) {
    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') { FS.status = 'needs-permission'; render(); return false; }
    if (mode === 'folder') {
      let n = 0; try { for await (const _ of h.entries()) { if (++n > 0) break; } } catch { }
      if (n && !fresh) {
        const ok = await ask('Set up Monitoring Desk here?', `<p style="margin:0;font-size:12.5px;line-height:1.6">“<b>${esc(h.name)}</b>” already has other files in it, and no Monitoring Desk data. The tool will add <span class="mono">monitoring-desk.json</span> and the folders <span class="mono">events/</span>, <span class="mono">locks/</span>, <span class="mono">packs/</span>. It never changes or deletes other files.</p><p style="margin:0;font-size:12px;color:var(--ink-2)">Tip: a dedicated sub-folder (for example <span class="mono">Monitoring Desk</span>) inside your team's synced folder keeps things tidy.</p>`, [{ label: 'Choose another folder', val: false }, { label: 'Set up here', val: true, pri: true }]);
        if (!ok) { FS.status = 'off'; FS.root = null; render(); return false; }
      }
    }
    marker = { app: APP, team: rand(10), created: new Date().toISOString(), by: me() };
    try { await writeJson(h, 'monitoring-desk.json', marker); } catch (e2) { FS.status = 'missing'; FS.error = e2.message; render(); return false; }
  }
  FS.team = (mode === 'demo' ? 'demo-' : '') + (marker.team || 'x');
  await Cache.open(FS.team);
  for (const [k, ev] of await Cache.loadAll()) { if (validEv(ev)) { DB.evs.set(ev.id, ev); DB.files.add(k); } }
  FS.status = 'connected';
  for (const d of ['events', 'locks']) await dirAt(d).catch(() => { });
  await scan(true);
  DB.fresh.clear();
  fold(); render(); startPolling();
  if (!me()) setTimeout(() => askIdentity(), 300);
  return true;
}
async function connectFolder() {
  if (!window.showDirectoryPicker) return toast('This browser can’t use folders. Open the tool in Microsoft Edge or Chrome.', true);
  let h;
  try { h = await window.showDirectoryPicker({ id: 'md-shared', mode: 'readwrite' }); }
  catch (err) { if (err.name !== 'AbortError') toast('Could not open the folder: ' + err.message, true); return; }
  if (await openRoot(h, 'folder')) { await KV.set('folder', h); store.set('mode', 'folder'); toast(`Connected to “${h.name}”`); go('today'); }
}
async function reconnect() {
  const h = FS.root || await KV.get('folder'); if (!h) return connectFolder();
  try { const p = await h.requestPermission({ mode: 'readwrite' }); if (p === 'granted') { await openRoot(h, 'folder'); toast('Reconnected'); } else toast('The browser still has no access to the folder.', true); }
  catch (err) { toast('Could not reconnect: ' + err.message, true); }
}
async function demoRoot(reset) {

async function openDemo(reset = false, stay = false) {

/* bundle finished months into packs/YYYY-MM.json so a new PC reads one file per month */
async function packMonths() {
  const cutoff = addDays(today(), -40).slice(0, 7);
  const byM = new Map();
  for (const ev of DB.evs.values()) { const m = ev.at.slice(0, 7); if (m < cutoff) byM.set(m, [...(byM.get(m) || []), ev]); }
  if (!byM.size) return toast('Nothing to compact yet — months are packed once they are 40+ days old.');
  const d = await dirAt('packs');
  let n = 0;
  for (const [m, evs] of byM) {
    let cur = null; try { cur = (await readJson(d, m + '.json')).data; } catch { }
    const ids = new Set((cur?.events || []).map(e => e.id));
    const all = [...(cur?.events || []), ...evs.filter(e => !ids.has(e.id))].sort((a, b) => a.at.localeCompare(b.at));
    if (cur && all.length === cur.events.length) continue;
    await writeJson(d, m + '.json', { app: APP, kind: 'pack', month: m, packedAt: new Date().toISOString(), by: me(), events: all });
    n++;
  }
  toast(n ? `Compacted ${n} month${n === 1 ? '' : 's'}. The original files stay as they are.` : 'Already compact.');
}

/* ------------------------------------------------------------- sample data */
async function seedDemo(root) {
  let seed = 20261015; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pois = l => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= rnd(); } while (p > L); return k - 1; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const P = [{ id: 'PNAIR', name: 'Priya Nair' }, { id: 'RDESAI', name: 'Rahul Desai' }, { id: 'SKULKARNI', name: 'Sana Kulkarni' }, { id: 'MJOSHI', name: 'Mihir Joshi' }];
  const T = today(), start = addDays(T, -182);
  const evs = [];
  const at = (date, h, m) => { const d = pd(date); d.setHours(h, m, Math.floor(rnd() * 59), Math.floor(rnd() * 999)); return d.toISOString(); };
  const push = (date, h, m, by, ops) => { const a = at(date, h, m); evs.push({ app: APP, v: SCHEMA, id: a.replace(/[-:.]/g, '').replace('Z', '') + '_' + by.id + '_' + rand(5), at: a, by, ops }); };
  const SYS = [
    { key: 'P01/100', sid: 'P01', client: '100', label: 'ECC Production · Europe', env: 'PRD', order: 1, f: 3, d: 10, me: true },
    { key: 'P01/200', sid: 'P01', client: '200', label: 'ECC Production · APAC', env: 'PRD', order: 2, f: 2, d: 6, me: true },
    { key: 'S4P/100', sid: 'S4P', client: '100', label: 'S/4HANA Finance', env: 'PRD', order: 3, f: 1.5, d: 7, me: true },
    { key: 'BWP/100', sid: 'BWP', client: '100', label: 'BW Production', env: 'PRD', order: 4, f: 2.5, d: 4, me: false },
    { key: 'Q01/300', sid: 'Q01', client: '300', label: 'ECC Quality', env: 'QAS', order: 5, f: 1, d: 3, me: false },
  ];
  const d0 = addDays(start, -3);
  push(d0, 9, 5, P[0], SYS.map(s => ({ t: 'sys.set', d: { key: s.key, sid: s.sid, client: s.client, label: s.label, env: s.env, order: s.order } })));
  const E = {};
  const mk = (key, by, day, e, causes) => {
    const id = 'e_demo_' + key; E[key] = { id, causes: {} };
    const ops = [{ t: 'entry.create', d: { id, kind: 'job', title: '', systems: [], area: '', owner: '', crit: 'normal', desc: '', tags: [], contact: '', ...e } }];
    for (const [ck, c] of Object.entries(causes)) { const cid = 'c_demo_' + key + '_' + ck; E[key].causes[ck] = cid; ops.push({ t: 'cause.add', d: { entryId: id, cause: { id: cid, systems: [], contact: '', fix: '', check: '', win: null, action: 'monitor', ...c } } }); }
    push(addDays(start, day), 10, 20, by, ops);
  };
  mk('italy', P[0], -2, { kind: 'job', name: 'ZJOB_ITALY1', title: 'Italy payroll posting to FI', systems: ['P01/100'], area: 'HR Payroll', owner: 'HR functional team', crit: 'high', contact: 'HR functional lead', desc: 'Posts the Italy payroll results to FI every night at 01:30.\nRuns after the payroll driver has finished. If it fails three nights in a row the FI close is at risk.', tags: ['payroll', 'italy', 'month-end'] },
    { pay: { title: 'Payroll run locks the personnel numbers', win: { type: 'dom', from: 20, to: 'end' }, action: 'ignore', check: 'Job log shows “Personnel number locked”. The payroll control record for Italy is “Released for payroll” during the run.', fix: 'Nothing to do — it runs clean once payroll exits. If it still fails after the 1st, escalate to the HR functional lead.' } });
  mk('glrecon', P[1], -1, { kind: 'job', name: 'ZFI_GL_RECON_DAILY', title: 'Daily GL reconciliation extract', systems: ['S4P/100'], area: 'FI', owner: 'Finance IT', crit: 'normal', contact: 'FI key users', desc: 'Extracts GL balances for the reconciliation tool at 05:00.', tags: ['fi', 'close'] },
    { period: { title: 'Posting period not opened yet', win: { type: 'start', n: 2 }, action: 'team', contact: 'FI key users', check: 'Spool says the posting period is not open.', fix: 'FI key users open the period; rerun after.' },
      close: { title: 'Month-end close lock', win: { type: 'end', n: 2 }, action: 'escalate', check: 'Job log: “Company code locked by user …” during closing activities.' } });
  mk('billing', P[2], 0, { kind: 'job', name: 'ZSD_BILLING_COLLECT', title: 'Collective billing run', systems: ['P01/100', 'P01/200'], area: 'SD', owner: 'Order-to-cash team', crit: 'high', contact: 'O2C lead', desc: 'Creates invoices for all due deliveries. Hourly from 06:00 to 22:00.', tags: ['billing', 'month-end'] },
    { runtime: { title: 'Cancelled by the 4-hour max runtime rule', win: { type: 'dom', from: 25, to: 'end' }, action: 'rerun', check: 'Status “Cancelled” with “maximum run time exceeded”. Volume of due billing documents is 3–4× normal.', fix: 'Rerun split by sales organisation.' },
      lock: { title: 'Sales documents locked by users', action: 'monitor', check: 'Job log lists documents “being processed by” a user. Usually clears by the next run.' } });
  mk('timeval', P[3], 1, { kind: 'job', name: 'ZHR_TIME_EVAL_APAC', title: 'Time evaluation APAC', systems: ['P01/200'], area: 'HR Time', owner: 'HR functional team', desc: 'Nightly time evaluation for APAC employees.', tags: ['hr', 'time'] },
    { locked: { title: 'Employee locked by someone in maintenance', action: 'rerun', check: 'Job log lists the personnel numbers that were locked.', fix: 'Rerun for those numbers in the morning.' } });
  mk('bwdelta', P[1], 2, { kind: 'job', name: 'ZBW_DELTA_SALES', title: 'BW sales delta load', systems: ['BWP/100'], area: 'BW', owner: 'BI team', contact: 'Basis on-call', desc: 'Loads the sales delta from ECC to BW at 03:00.', tags: ['bw', 'interface'] },
    { rfc: { title: 'Source system connection down', action: 'escalate', contact: 'Basis on-call', check: 'Connection test to the source system fails.', fix: 'Basis restores the connection, then repeat the delta.' },
      maint: { title: 'Basis maintenance window', win: { type: 'wd', days: [0] }, action: 'ignore', check: 'Sunday night maintenance announced in the Basis calendar.' } });
  mk('tsv', P[0], 3, { kind: 'dump', name: 'TSV_TNEW_PAGE_ALLOC_FAILED', title: 'Memory exhausted in a program', systems: ['P01/100', 'S4P/100'], area: 'Performance', owner: 'ABAP team', crit: 'normal', desc: 'The program asked for more memory than allowed. Look at which program and user.', tags: ['memory', 'month-end'] },
    { selections: { title: 'Huge month-end selections in custom reports', win: { type: 'dom', from: 20, to: 'end' }, action: 'monitor', check: 'Terminated program is a Z report run by a batch user over a whole month or company code.', fix: 'If one report repeats 3+ times, raise it with the ABAP team to add paging.' },
      kernel: { title: 'Memory parameter reset after kernel patch', action: 'escalate', contact: 'Basis', check: 'Many different programs fail on the same day right after a patch weekend.' } });
  mk('msgx', P[2], 4, { kind: 'dump', name: 'MESSAGE_TYPE_X', title: 'Standard program raised a hard stop', systems: ['P01/200'], area: 'Interfaces', owner: 'Integration team', desc: 'Usually inside inbound IDoc processing.', tags: ['idoc'] },
    { idoc: { title: 'Inconsistent IDoc status in inbound processing', action: 'monitor', check: 'Call stack shows the IDoc inbound function module; the IDoc number is in the variables.', fix: 'Integration team reprocesses the IDoc.' } });
  mk('dupkey', P[3], 5, { kind: 'dump', name: 'DBSQL_DUPLICATE_KEY_ERROR', title: 'Insert of a record that already exists', systems: ['S4P/100'], area: 'FI', owner: 'ABAP team' },
    { twice: { title: 'Job started twice by overlapping schedules', action: 'self', check: 'Two runs of the same job started within a minute of each other.', fix: 'Remove the duplicate schedule.' } });
  mk('timeout', P[1], 6, { kind: 'dump', name: 'TIME_OUT', title: 'Dialog step took too long', systems: ['P01/100'], area: 'Performance' },
    { dialog: { title: 'Heavy report run in the foreground', action: 'ignore', check: 'The user is a dialog user, not a batch user.', fix: 'Tell the user to run it in the background.' } });

    { sunday: { title: 'Basis maintenance window', win: { type: 'wd', days: [0] }, action: 'ignore' } });
  /* retire the kernel cause after a while */

  /* six months of readings + incidents */
  for (let i = 0; i <= 181; i++) {
    const d = addDays(start, i), dom = domOf(d), dim = dimOf(d), wd = pd(d).getDay(), late = dom >= 20;
    if (rnd() < .04) continue;
    const by = P[Math.floor(i / 7) % 4];
    const rows = SYS.map(s => {
      let fM = 1, dM = 1;
      if (late && s.me) { fM *= 1.6; dM *= 1.9; }
      if (dom >= dim - 1 && s.key === 'S4P/100') { fM *= 1.8; dM *= 1.4; }
      if (wd === 1) fM *= 1.3;
      if (rnd() < .025) dM *= 3;
      return { sys: s.key, failed: pois(s.f * fM), dumps: pois(s.d * dM), note: '' };

    if (wd === 1 && rnd() < .5) o('bwdelta', 'maint', 'BWP/100', 'ignored', 'Sunday maintenance.');
    if (rnd() < .025) o('bwdelta', 'rfc', 'BWP/100', 'resolved', 'Basis restored the connection, delta repeated.', 'INC00' + (41000 + i));

  /* write: finished months as packs, the current month as single files (tests both paths) */
  evs.sort((a, b) => a.at.localeCompare(b.at));
  await writeJson(root, 'monitoring-desk.json', { app: APP, team: 'sample', created: new Date().toISOString(), sample: true });
  const cur = new Date().toISOString().slice(0, 7);
  const byM = new Map(); for (const ev of evs) { const m = ev.at.slice(0, 7); byM.set(m, [...(byM.get(m) || []), ev]); }
  const packs = await root.getDirectoryHandle('packs', { create: true });
  const evRoot = await root.getDirectoryHandle('events', { create: true });
  for (const [m, list] of byM) {
    if (m < cur) await writeJson(packs, m + '.json', { app: APP, kind: 'pack', month: m, events: list });
    else { const md = await evRoot.getDirectoryHandle(m, { create: true }); for (const ev of list) await writeJson(md, ev.id + '.json', ev); }
  }
  await root.getDirectoryHandle('locks', { create: true });
}

(async function boot() {
  applyTheme();

  if (h[0] === 'entry' && h[1]) { UI.view = 'entry'; UI.entry = h[1]; } else if (VIEWS.includes(h[0])) UI.view = h[0];

  if (mode === 'demo') { await openDemo(false, true); return; }
  if (!window.showDirectoryPicker) { FS.status = 'unsupported'; render(); return; }
  const handle = await KV.get('folder');
  if (!handle) { render(); return; }
  FS.root = handle; FS.name = handle.name; FS.mode = 'folder';
  let perm = 'prompt'; try { perm = await handle.queryPermission({ mode: 'readwrite' }); } catch { }
  if (perm === 'granted') await openRoot(handle, 'folder');
  else { FS.status = 'needs-permission'; render(); }
})();
