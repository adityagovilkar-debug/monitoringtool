    label(ctx, `${hotText(hw)} · ${hw.factor.toFixed(1)}×`, (x1 + x2) / 2, 4, { size: 8.5, color: C['pen-4'], spacing: .6, weight: 600 });
    ctx.globalAlpha = .045; ctx.fillStyle = C['pen-4']; ctx.fillRect(x1 - 2, padT - 6, x2 - x1 + 4, ch + 8); ctx.globalAlpha = 1;
  }
  for (let d = 1; d <= 31; d++) {
    const x = padL + (d - .5) * cw, v = pr.avg[d];
    const hi = s.hi >= 0 && s.hits[s.hi]?.d === d;
    const sub = cw >= 20 ? 3 : cw >= 12 ? 2 : 1;
    if (v == null) dot(ctx, x, padT + ch, .7, C['ink-4']);
    else for (let j = 0; j < sub; j++) dotStack(ctx, x + (j - (sub - 1) / 2) * 3.6, padT + ch, ch * p, v / max, col, -1, step, hi);
    if (d === 1 || d % 5 === 0 || d === 31) label(ctx, String(d), x, h - 8, { font: MONO, size: 8.5, weight: 400, color: d === td ? C['ink'] : C['ink-3'] });
    s.hits.push({ d, x: x - cw / 2, y: padT - 6, w: cw, h: ch + 12, tip: v == null ? `<b>${ord(d)}</b> · no readings` : `<b>${ord(d)}</b> of the month<br>avg ${v.toFixed(1)} ${esc(METRIC[pr.metric].label.toLowerCase())} · ${pr.cnt[d]} day${pr.cnt[d] === 1 ? '' : 's'}${pr.ratio[d] ? `<br>${pr.ratio[d].toFixed(2)}× the month average` : ''}` });
  }
  if (opt.today !== false) { const x = padL + (td - .5) * cw; line(ctx, x, padT - 8, x, padT + ch + 4, C['ink'], .55, [2, 3]); label(ctx, 'TODAY', x, padT - 14, { size: 7.5, spacing: 1.2, color: C['ink-2'] }); }
  if (pr.mean) { const y = padT + ch - ch * Math.min(1, pr.mean / max) * p; line(ctx, padL, y, w - padR, y, col, .35, [4, 4]); label(ctx, 'avg', w - padR, y - 6, { size: 8, color: C['ink-3'], align: 'right', weight: 400 }); }
}

function drawCalendar(ctx, w, h, t, dt, s, p, metric, sys, months) {
  const to = today(), start0 = addDays(to, -Math.round(months * 30.5));
  const sd = pd(start0); const off = (sd.getDay() + 6) % 7; const start = addDays(start0, -off);
  const weeks = Math.ceil((daysBetween(start, to) + 1) / 7);
  const padL = 24, padT = 18, cell = Math.min((w - padL - 6) / weeks, (h - padT - 4) / 7);
  const ser = series(metric, sys, start, to);
  const vals = [...ser.values()].sort((a, b) => a - b);
  const p95 = vals.length ? vals[Math.floor(vals.length * .95)] || vals.at(-1) : 1, p5 = vals.length ? vals[Math.floor(vals.length * .05)] : 0;
  const col = C[METRIC[metric].pen];
  ['M', '', 'W', '', 'F', '', 'S'].forEach((l, i) => l && label(ctx, l, 8, padT + i * cell + cell / 2, { size: 8, weight: 500 }));
  let lastM = -1;
  for (let wk = 0; wk < weeks; wk++) {
    for (let r = 0; r < 7; r++) {
      const d = addDays(start, wk * 7 + r); if (d > to) continue;
      const x = padL + wk * cell + cell / 2, y = padT + r * cell + cell / 2;
      if (r === 0) { const m = pd(d).getMonth(); if (m !== lastM) { label(ctx, MON[m].toUpperCase(), x - cell / 2, 6, { size: 8, align: 'left', spacing: 1 }); lastM = m; } }
      const v = ser.get(d), hi = s.hi >= 0 && s.hits[s.hi]?.d === d;
      const reveal = clamp(p * weeks - wk * .9, 0, 1);
      if (d < start0) continue;
      if (v == null) dot(ctx, x, y, .7, C['ink-4']);
      else if (v === 0) dot(ctx, x, y, 1.2, C['ink-4']);
      else { const f = clamp((v - p5 * .8) / Math.max(1, p95 - p5 * .8), 0, 1.15); dot(ctx, x, y, (1.1 + f * (cell * .34)) * reveal, col, .22 + .78 * Math.min(1, f)); }
      if (hi) ring(ctx, x, y, cell * .45, C['ink'], .8);
      if (d === to) ring(ctx, x, y, cell * .48, C['ink'], .6);
      s.hits.push({ d, x: x - cell / 2, y: y - cell / 2, w: cell, h: cell, tip: `<b>${esc(fmtD(d))}</b> ${pd(d).getFullYear()}<br>${v == null ? 'no reading' : `${v} ${esc(METRIC[metric].label.toLowerCase())}`}`, go: () => { UI.logDate = d; go('log'); } });
    }
  }
}

/* Mirror timeline: dumps rise above the line, failed jobs hang below. */
function drawMirror(ctx, w, h, t, dt, s, p, sys, days, maxes) {
  const to = today(), from = addDays(to, -days + 1);
  const dS = series('dumps', sys, from, to), fS = series('failed', sys, from, to);
  const mid = h * .56, cw = w / days, upH = mid - 4, dnH = h - mid - 4;
  const mD = maxes?.d || Math.max(1, ...dS.values()), mF = maxes?.f || Math.max(1, ...fS.values());
  line(ctx, 0, mid, w, mid, C['rule-strong'], .8);
  for (let i = 0; i < days; i++) {
    const d = addDays(from, i), x = i * cw + cw / 2, hi = s.hi >= 0 && s.hits[s.hi]?.d === d;
    const dv = dS.get(d), fv = fS.get(d);
    if (domOf(d) === 1) { line(ctx, x - cw / 2, 2, x - cw / 2, h - 2, C['rule'], 1, [1, 3]); }
    if (dv != null) dotStack(ctx, x, mid - 3, upH * p, Math.sqrt(dv / mD), C['pen-1'], -1, 3, hi); else dot(ctx, x, mid - 3, .6, C['ink-4']);
    if (fv != null) dotStack(ctx, x, mid + 3, dnH * p, Math.sqrt(fv / mF), C['pen-2'], 1, 3, hi);
    s.hits.push({ d, x: x - cw / 2, y: 0, w: cw, h, tip: `<b>${esc(fmtD(d))}</b>${sys ? ' · ' + esc(sys) : ''}<br>${dv ?? '–'} dumps · ${fv ?? '–'} failed jobs` });
  }
}

function drawWeekday(ctx, w, h, t, dt, s, p, metric, sys) {
  const v = weekdayProfile(metric, sys, 6), order = [1, 2, 3, 4, 5, 6, 0], max = Math.max(1, ...v), col = C[METRIC[metric].pen];
  const cw = w / 7, ch = h - 22;
  order.forEach((k, i) => {
    const x = i * cw + cw / 2, hi = s.hi >= 0 && s.hits[s.hi]?.k === k;
    for (let j = -1; j <= 1; j++) dotStack(ctx, x + j * 4, ch, ch * p, v[k] / max, col, -1, 3.4, hi);
    label(ctx, DOW[k].toUpperCase(), x, h - 7, { size: 8, spacing: 1, color: pd(today()).getDay() === k ? C['ink'] : C['ink-3'] });
    s.hits.push({ k, x: x - cw / 2, y: 0, w: cw, h, tip: `<b>${DOWL[k]}</b><br>avg ${v[k].toFixed(1)} ${esc(METRIC[metric].label.toLowerCase())}` });
  });
}

function drawMonths(ctx, w, h, t, dt, s, p, sys) {
  const to = today(); const rows = [];
  for (let k = 11; k >= 0; k--) { const d = pd(to); d.setDate(1); d.setMonth(d.getMonth() - k); const m = ymd(d).slice(0, 7); rows.push(m); }
  const sums = rows.map(m => { const from = m + '-01', end = m + '-' + pad(dimOf(from)); const dS = series('dumps', sys, from, end), fS = series('failed', sys, from, end); const n = Math.max(dS.size, 1); return { m, d: [...dS.values()].reduce((a, b) => a + b, 0) / n, f: [...fS.values()].reduce((a, b) => a + b, 0) / Math.max(fS.size, 1), n: dS.size }; });
  const mD = Math.max(1, ...sums.map(x => x.d)), mF = Math.max(1, ...sums.map(x => x.f));
  const cw = w / 12, ch = h - 22;
  sums.forEach((x, i) => {
    const cx = i * cw + cw / 2, hi = s.hi >= 0 && s.hits[s.hi]?.m === x.m;
    if (x.n) { dotStack(ctx, cx - 3.5, ch, ch * p, x.d / mD, C['pen-1'], -1, 3.3, hi); dotStack(ctx, cx + 3.5, ch, ch * p, x.f / mF, C['pen-2'], -1, 3.3, hi); }
    else dot(ctx, cx, ch, .8, C['ink-4']);
    label(ctx, MON[+x.m.slice(5) - 1].slice(0, 3).toUpperCase(), cx, h - 7, { size: 7.5, spacing: .8, color: x.m === to.slice(0, 7) ? C['ink'] : C['ink-3'] });
    s.hits.push({ m: x.m, x: cx - cw / 2, y: 0, w: cw, h, tip: x.n ? `<b>${MON[+x.m.slice(5) - 1]} ${x.m.slice(0, 4)}</b><br>avg ${x.d.toFixed(1)} dumps/day · ${x.f.toFixed(1)} failed jobs/day<br>${x.n} days logged` : `<b>${MON[+x.m.slice(5) - 1]} ${x.m.slice(0, 4)}</b><br>no readings` });
  });
}

/* Entry: the last N days as a strip — every incident is a dot, coloured by what was done about it. */
function drawStrip(ctx, w, h, t, dt, s, p, e, days = 120) {
  const to = today(), from = addDays(to, -days + 1), cw = w / days, mid = h / 2 + 2;
  const by = new Map(); for (const o of e.occs) if (o.date >= from) by.set(o.date, [...(by.get(o.date) || []), o]);
  for (let i = 0; i < days; i++) {
    const d = addDays(from, i), x = i * cw + cw / 2, list = by.get(d), reveal = clamp(p * days - i * .8, 0, 1);
    if (domOf(d) === 1) { line(ctx, x - cw / 2, 4, x - cw / 2, h - 4, C['rule-strong'], 1, [1, 3]); label(ctx, MON[pd(d).getMonth()].toUpperCase(), x - cw / 2 + 3, 6, { size: 7.5, align: 'left', spacing: 1 }); }
    if (!list) { dot(ctx, x, mid, .65, C['ink-4']); continue; }
    list.forEach((o, j) => {
      const c = e.causes.get(o.causeId), colK = c ? ACTIONS[c.action]?.pen : STATUS[o.status]?.pen;
      dot(ctx, x, mid - j * 6, 2.4 * reveal, C[colK || 'ink-2']);
    });
    if (s.hi >= 0 && s.hits[s.hi]?.d === d) ring(ctx, x, mid - (list.length - 1) * 3, 6 + list.length * 3, C['ink'], .6);
    s.hits.push({ d, x: x - Math.max(cw, 6) / 2, y: 0, w: Math.max(cw, 6), h, tip: `<b>${esc(fmtD(d))}</b><br>` + list.map(o => `${esc(o.sys)} · ${esc(e.causes.get(o.causeId)?.title || 'cause not identified')}`).join('<br>') });
  }
  if (domOf(to)) { const x = w - cw / 2; ring(ctx, x, mid, 4, C['ink'], .5); }
}
function drawOccDom(ctx, w, h, t, dt, s, p, e) {
  const cnt = Array(32).fill(0); for (const o of e.occs) cnt[domOf(o.date)]++;
  const max = Math.max(1, ...cnt), cw = w / 31, ch = h - 16;
  for (let d = 1; d <= 31; d++) {
    const x = (d - .5) * cw, hi = s.hi >= 0 && s.hits[s.hi]?.d === d;
    dotStack(ctx, x, ch, ch * p, cnt[d] / max, C[KINDS[e.kind]?.pen || 'ink'], -1, 3.2, hi);
    if (d === 1 || d % 5 === 0) label(ctx, String(d), x, h - 5, { font: MONO, size: 8, weight: 400, color: d === domOf(today()) ? C['ink'] : C['ink-3'] });
    s.hits.push({ d, x: x - cw / 2, y: 0, w: cw, h, tip: `<b>${ord(d)}</b> of the month · ${cnt[d]} incident${cnt[d] === 1 ? '' : 's'}` });
  }
}
function drawSpinner(ctx, w, h, t) { dotRing(ctx, w / 2, h / 2, Math.min(w, h) / 2 - 8, ((t / 1600) % 1), 36, C['pen-2'], 0); }
function drawWelcome(ctx, w, h, t, dt, s, p, kind) {
  if (kind === 'folder') {
    const n = 7, cw = w / n;
    for (let i = 0; i < n; i++) { const x = i * cw + cw / 2, ph = (t / 900 + i * .45) % 3; const a = ph < 1 ? ph : 0; dot(ctx, x, h / 2, 2.2, C['ink-3']); if (!reduced) ring(ctx, x, h / 2, 4 + a * 14, C['pen-2'], .5 * (1 - a)); if (i < n - 1) line(ctx, x + 6, h / 2, x + cw - 6, h / 2, C['rule-strong'], 1, [2, 3]); }
  } else {
    const n = 40, cw = w / n;
    for (let i = 0; i < n; i++) { const d = i % 30; const v = (d >= 19 ? 1.7 : 1) * (.35 + .3 * Math.sin(i * 1.7 + 1) ** 2); dotStack(ctx, i * cw + cw / 2, h - 6, (h - 12) * p, v / 1.9, d >= 19 ? C['pen-1'] : C['pen-5'], -1, 3.2); }
  }
}
</script>
<script>
/* ======================================================================
   Views
   ====================================================================== */
const UI = {
  view: 'today', entry: null,
  kb: { q: '', kind: 'all', sys: '', sort: 'recent', arch: false },
  occ: { status: 'active', sys: '', q: '', range: 30, who: '' },
  tr: { metric: 'dumps', sys: '', months: 6 },
  logDate: null, pending: false, showRetired: false,
};
const VIEWS = ['today', 'log', 'kb', 'occ', 'trends', 'settings'];
const VIEW_TITLE = { today: 'Today', log: 'Morning readings', kb: 'Knowledge base', entry: 'Entry', occ: 'Incidents', trends: 'Trends', settings: 'Settings', welcome: 'Welcome' };

function go(v, arg) {
  if (v === 'entry') location.hash = '#entry/' + encodeURIComponent(arg);
  else location.hash = '#' + v;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [v, a] = h.split('/');
  if (UI.view === 'log' && v !== 'log') releaseLock('readings:' + (UI.logDate || today()));
  if (v === 'entry' && a) { UI.view = 'entry'; UI.entry = a; }
  else UI.view = VIEWS.includes(v) ? v : 'today';
  render(true);
  $('#main').scrollTop = 0;
}
addEventListener('hashchange', route);

function softRender() {
  const a = document.activeElement;
  if (a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { UI.pending = true; paintChrome(); return; }
  render(false);
}
document.addEventListener('focusout', () => setTimeout(() => { if (UI.pending) { const a = document.activeElement; if (!(a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { UI.pending = false; render(false); } } }, 50));

function render(anim = true) {
  const host = $('#view');
  UI.pending = false; hideTip();
  let v = UI.view;
  const ready = FS.status === 'connected';
  if (!ready && v !== 'settings') v = 'welcome';
  if (v === 'log' && !UI.logDate) UI.logDate = today();
  let html = '';
  try {
    html = ({ welcome: vWelcome, today: vToday, log: vLog, kb: vKb, entry: vEntry, occ: vOcc, trends: vTrends, settings: vSettings })[v]();
  } catch (err) { console.error(err); html = `<div class="empty"><b>Something went wrong drawing this page</b>${esc(err.message)}</div>`; }
  const keepScroll = !anim ? $('#main').scrollTop : 0;
  host.classList.toggle('anim', anim);
  host.innerHTML = html;
  host.querySelectorAll('.rise').forEach((el, i) => el.style.setProperty('--i', i));
  mountCharts(v);
  if (!anim) $('#main').scrollTop = keepScroll;
  paintChrome(v);
}

function paintChrome(v = UI.view) {
  /* rail */
  const railV = v === 'entry' ? 'kb' : v;
  const btn = $(`.rb[data-go="${railV}"]`);
  $$('.rb').forEach(b => b.classList.toggle('on', b === btn));
  const ind = $('#ind');
  if (btn) { ind.style.display = ''; ind.style.transform = `translateY(${btn.offsetTop + 6}px)`; ind.style.background = getComputedStyle(btn).getPropertyValue('--pen'); }
  else ind.style.display = 'none';
  const oc = canWrite() ? openOccs().length : 0;
  $('#openCnt').textContent = oc ? oc : '';
  /* crumb */
  const e = v === 'entry' ? entryOf(S(), UI.entry) : null;
  $('#crumb').innerHTML = canWrite() ? (e ? `${esc(VIEW_TITLE.kb)} / <b>${esc(e.name)}</b>` : `<b>${esc(VIEW_TITLE[v] || '')}</b>`) : '';
  /* pills */
  const fp = $('#folderPill');
  fp.className = 'pill ' + (FS.mode === 'demo' ? 'demo' : FS.status === 'connected' ? 'ok' : FS.status === 'needs-permission' ? 'warn' : FS.status === 'missing' ? 'bad' : '');
  $('span', fp).textContent = FS.mode === 'demo' ? 'Sample data' : FS.status === 'connected' ? FS.name : FS.status === 'needs-permission' ? 'Reconnect ' + FS.name : FS.status === 'missing' ? 'Folder missing' : 'Not connected';
  const who = me(), wp = $('#whoPill');
  wp.className = 'pill ' + (who ? 'ok' : 'warn');
  $('span', wp).textContent = who ? `${who.name} · ${who.id}` : 'Set your ID';
  /* status bar */
  const led = $('#led');
  led.style.background = FS.status === 'connected' ? (FS.error ? 'var(--watch)' : 'var(--good)') : FS.status === 'needs-permission' ? 'var(--watch)' : 'var(--ink-4)';
  $('#sbState').textContent = FS.status === 'connected' ? (FS.error ? 'Folder problem: ' + FS.error : `${FS.mode === 'demo' ? 'Sample data (not shared)' : 'Shared folder'} · checked ${FS.lastScan ? rel(new Date(FS.lastScan).toISOString()) : '—'}`) : FS.status === 'needs-permission' ? 'Click “Reconnect” to give the browser access again' : FS.status === 'loading' ? 'Opening…' : 'Not connected';
  $('#sbCount').textContent = canWrite() ? `${DB.evs.size} saves · ${liveEntries().length} entries · ${S().occs.size} incidents · ${S().readings.size} readings` : '';
  const others = [...DB.locks.values()].filter(x => x.by !== me()?.id && Date.now() - Date.parse(x.hb) < LOCK_TTL);
  $('#sbLocks').textContent = others.length ? `✎ ${others.map(x => `${x.name || x.by} → ${x.label}`).join(' · ')}` : '';
  $('#sbVer').textContent = 'v' + VER + (UI.pending ? ' · new changes waiting' : '');
  /* mark */
  const mk = $('#mark'); if (!mk.children.length) mk.innerHTML = '<i></i>'.repeat(9);
  const hot = canWrite() ? watchouts().some(w => w.now) : false;
  [...mk.children].forEach((i, k) => { i.className = k === 4 ? 'on' : k % 2 === 0 && hot ? 'hot' : k % 2 === 0 ? 'on' : ''; });
}

/* canvas mounting per view */
function mountCharts(v) {
  for (const cv of $$('#view canvas[data-ch]')) {
    const k = cv.dataset.ch;
    if (k === 'radar') scope(cv, drawRadar, { anim: true, intro: false });
    else if (k === 'dom') { const pr = domProfile(cv.dataset.metric || UI.tr.metric, cv.dataset.sys || null, +cv.dataset.months || UI.tr.months); scope(cv, (c, w, h, t, dt, s, p) => drawDomProfile(c, w, h, t, dt, s, p, pr)); }
    else if (k === 'cal') scope(cv, (c, w, h, t, dt, s, p) => drawCalendar(c, w, h, t, dt, s, p, UI.tr.metric, UI.tr.sys || null, UI.tr.months));
    else if (k === 'mirror') { const days = +cv.dataset.days || 90, sys = cv.dataset.sys || null; const mx = cv.dataset.shared ? MIRROR_MAX : null; scope(cv, (c, w, h, t, dt, s, p) => drawMirror(c, w, h, t, dt, s, p, sys, days, mx)); }
    else if (k === 'wd') scope(cv, (c, w, h, t, dt, s, p) => drawWeekday(c, w, h, t, dt, s, p, UI.tr.metric, UI.tr.sys || null));
    else if (k === 'months') scope(cv, (c, w, h, t, dt, s, p) => drawMonths(c, w, h, t, dt, s, p, UI.tr.sys || null));
    else if (k === 'strip') { const e = entryOf(S(), UI.entry); if (e) scope(cv, (c, w, h, t, dt, s, p) => drawStrip(c, w, h, t, dt, s, p, e, 120)); }
    else if (k === 'occdom') { const e = entryOf(S(), UI.entry); if (e) scope(cv, (c, w, h, t, dt, s, p) => drawOccDom(c, w, h, t, dt, s, p, e)); }
    else if (k === 'wfolder' || k === 'wdemo') scope(cv, (c, w, h, t, dt, s, p) => drawWelcome(c, w, h, t, dt, s, p, k === 'wfolder' ? 'folder' : 'demo'), { anim: true });
  }
}
let MIRROR_MAX = null;

/* ------------------------------------------------------------- small pieces */
const kindBadge = k => `<span class="kb" style="--pen:${pen(KINDS[k]?.pen || 'ink-3')}"><i></i>${esc(KINDS[k]?.label || k)}</span>`;
const actChip = a => `<span class="chip" style="--pen:${pen(ACTIONS[a]?.pen || 'ink-3')}"><i></i>${esc(ACTIONS[a]?.label || a)}</span>`;
const statusChip = s => `<span class="chip" style="--pen:${pen(STATUS[s]?.pen || 'ink-3')}"><i></i>${esc(STATUS[s]?.label || s)}</span>`;
const sysChips = list => (list || []).map(k => `<span class="sysc">${esc(k)}</span>`).join(' ');
const personName = id => S().people.get(id)?.name || id;
const whoLine = (by, at) => `<span class="who">${esc(by?.name || by?.id || '?')}</span> <span class="dim mono" style="font-size:10px">${esc(rel(at))}</span>`;
function lockBadge(target) {
  const x = lockHolder(target);
  if (x) return `<span class="lockb" title="Soft lock: they opened it for editing. You can still edit; clashing fields will be flagged."><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>${esc(x.name || x.by)} is editing · since ${hhmm(x.at)}</span>`;
  if (DB.myLocks.has(target)) return `<span class="lockb mine"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>You are editing</span>`;
  return '';
}
function unit(title, body, { meta = '', p = 'ink', cls = '', id = '' } = {}) {
  return `<section class="unit rise ${cls}" style="--pen:${pen(p)}" ${id ? `id="${id}"` : ''}><div class="head"><h2><i></i>${title}</h2><div class="meta">${meta}</div></div>${body}</section>`;
}
function emptyState(title, text, btn = '') { return `<div class="empty"><b>${title}</b><span>${text}</span>${btn}</div>`; }

/* ------------------------------------------------------------- welcome */
function vWelcome() {
  const st = FS.status;
  const supported = !!window.showDirectoryPicker;
  let main = '';
  if (st === 'needs-permission') main = `<div class="banner rise" style="--pen:var(--watch)"><span class="ic"></span><span>The browser needs your OK again to use <b class="mono">${esc(FS.name)}</b>. This happens after the browser restarts.</span><button class="btn pri" data-act="reconnect">Reconnect</button></div>`;
  else if (st === 'missing') main = `<div class="banner rise" style="--pen:var(--bad)"><span class="ic"></span><span>The shared folder <b class="mono">${esc(FS.name)}</b> can't be found. Is OneDrive running and the folder still synced?</span><button class="btn" data-act="connect">Choose it again</button></div>`;
  else if (st === 'loading') main = `<div class="banner rise" style="--pen:var(--pen-2)"><span class="ic"></span><span>Opening the shared folder…</span><span></span></div>`;
  return `<div class="welcome">
    <div class="lbl rise">Monitoring Desk · v${VER}</div>
    <h1 class="rise">One place for what the team learns<br>from every failed job and dump.</h1>
    <p class="rise">Log the morning readings, look up a failing job to see what caused it before, and add what you found so the next person doesn't start from zero. Everything is saved to a shared OneDrive folder, so the whole team sees the same history — and the trends show when trouble usually comes.</p>
    ${main}
    <div class="wtiles">
      <button class="unit wtile rise" data-act="connect" style="--pen:var(--pen-2)" ${supported ? '' : 'disabled'}>
        <canvas data-ch="wfolder"></canvas>
        <span class="lbl">For the team</span><span class="nm">Connect the shared folder</span>
        <span class="bl">Pick a Teams / SharePoint folder that OneDrive syncs to your PC — the same way as the Code Review Desk. Everyone on the team picks the same folder. ${supported ? '' : '<br><b style="color:var(--bad)">This browser can’t use folders. Open the tool in Microsoft Edge or Chrome.</b>'}</span>
        <span class="go">Choose folder →</span>
      </button>
      <button class="unit wtile rise" data-act="demo" style="--pen:var(--pen-5)">
        <canvas data-ch="wdemo"></canvas>
        <span class="lbl">Just looking</span><span class="nm">Explore with sample data</span>
        <span class="bl">Six months of made-up readings, jobs, dumps and incidents (with a month-end payroll spike) so you can try everything. Nothing is shared and it never touches the real folder.</span>
        <span class="go">Open sample →</span>
      </button>
    </div>
    <div class="note rise" style="margin-top:22px"><span class="ring"></span><span><b>How two people can't break it:</b> nothing is ever edited in place. Each save is a new small file named after you and the time, so OneDrive never has two versions of the same file to fight over. If someone else has an entry open, you see who; if you both change the same field anyway, the tool shows both versions and asks which to keep.</span></div>
  </div>`;
}

/* ------------------------------------------------------------- today */
function vToday() {
  const t = today(), d = pd(t), who = me();
  const rows = sysList();
  const reads = rows.map(x => ({ x, r: S().readings.get(t + '|' + x.key) }));
  const logged = reads.filter(r => r.r);
  const lastBy = logged.sort((a, b) => b.r.at.localeCompare(a.r.at))[0]?.r;
  const open = openOccs();
  const w = watchouts(t);
  const active = causesActive(t);
  const conflicts = liveEntries().filter(e => e.conflicts.length);
  const dups = liveEntries().filter(e => e.dups?.length && !e.archived);
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';

  const banners = [];
  const part = x => `${METRIC[x.metric].label.toLowerCase()} <b class="mono">${x.h.factor.toFixed(1)}×</b> (about ${Math.round(x.h.inMean)} a day vs ${Math.round(x.h.outMean)})`;
  const nowW = w.filter(x => x.now), soonW = w.filter(x => !x.now);
  if (nowW.length) banners.push(`<div class="banner pulse" style="--pen:var(--pen-4)"><span class="ic"></span><span><b>Busy stretch of the month:</b> ${nowW.map(x => `from the ${hotText(x.h)}, ${part(x)}`).join('; ')} — higher than the rest of the month. Expect more problems than usual today.</span><button class="btn sm ghost" data-act="trends-metric" data-m="${nowW[0].metric}">See trend →</button></div>`);
  if (soonW.length) { const x0 = soonW.sort((a, b) => a.inDays - b.inDays)[0]; banners.push(`<div class="banner" style="--pen:var(--pen-4)"><span class="ic"></span><span><b>Heads-up:</b> in ${x0.inDays === 1 ? '1 day' : x0.inDays + ' days'} (the ${ord(x0.h.from)}) the usual busy stretch starts — ${soonW.map(x => `from the ${hotText(x.h)}: ${part(x)}`).join('; ')}. Worth telling the team.</span><button class="btn sm ghost" data-act="trends-metric" data-m="${x0.metric}">See trend →</button></div>`); }
  if (conflicts.length) banners.push(`<div class="banner" style="--pen:var(--pen-5)"><span class="ic"></span><span><b>${conflicts.length} entr${conflicts.length === 1 ? 'y has' : 'ies have'} edits that crossed</b> — two people changed the same field at the same time. Both versions are kept; pick one.</span><button class="btn sm ghost" data-entry="${esc(conflicts[0].id)}">Review →</button></div>`);
  if (dups.length) banners.push(`<div class="banner" style="--pen:var(--pen-5)"><span class="ic"></span><span><b class="mono">${esc(dups[0].name)}</b> was created twice (probably at the same time by two people). Merge them so the history stays in one place.</span><button class="btn sm ghost" data-entry="${esc(dups[0].id)}">Merge →</button></div>`);

  const readRows = reads.map(({ x, r }) => {
    const fF = r ? readingFlag(x.key, 'failed', t, r.failed) : null, fD = r ? readingFlag(x.key, 'dumps', t, r.dumps) : null;
    const hi = fF?.k === 'hi' || fD?.k === 'hi';
    return `<tr class="link" data-act="go-log"><td><span class="nm">${esc(x.key)}</span><div class="sub">${esc(x.label)}</div></td>
      <td class="num">${r ? (r.failed ?? '–') : '<span class="dim">·</span>'}</td><td><span class="flag ${fF?.k || 'na'}">${esc(fF?.t || '')}</span></td>
      <td class="num">${r ? (r.dumps ?? '–') : '<span class="dim">·</span>'}</td><td><span class="flag ${fD?.k || 'na'}">${esc(fD?.t || '')}</span></td>
      <td>${hi ? '<span class="today-tag" style="color:var(--bad)">look into it</span>' : r ? '<span class="today-tag yes">ok</span>' : '<span class="today-tag no">not logged</span>'}</td></tr>`;
  }).join('');

  const openRows = open.slice(0, 8).map(o => {
    const e = entryOf(S(), o.entryId), c = e?.causes.get(o.causeId);
    return `<div class="row link" data-occ="${esc(o.id)}"><span class="nm">${kindBadge(e.kind)} <b class="mono">${esc(e.name)}</b> <span class="mono dim">${esc(o.sys)}</span> · ${esc(c?.title || 'cause not identified yet')}</span><span class="val">${statusChip(o.status)}<span class="dim">${esc(fmtShort(o.date))}</span></span></div>`;
  }).join('');

  const activeRows = active.slice(0, 8).map(({ e, c }) => `<div class="row link" data-entry="${esc(e.id)}"><span class="nm">${kindBadge(e.kind)} <b class="mono">${esc(e.name)}</b> · ${esc(c.title)} <span class="dim">(${esc(winText(c.win))})</span></span><span class="val">${actChip(c.action)}</span></div>`).join('');

  const acts = S().activity.slice(0, 14).map(a => `<div class="act"><span class="t">${esc(rel(a.at))}</span><span class="p" style="--pen:${pen(a.kind === 'dump' ? 'pen-1' : a.kind === 'job' ? 'pen-2' : a.kind === 'occ' ? 'pen-4' : a.kind === 'read' ? 'pen-6' : a.kind === 'cause' ? 'pen-3' : 'ink-3')}"></span><span class="x"><b>${esc(a.by.name || a.by.id)}</b> ${a.text}</span></div>`).join('');

  return `
  <section class="unit hero rise" style="--pen:var(--pen-2)">
    <div class="hero-in">
      <span class="lbl">${greet}${who ? ', ' + esc(who.name.split(' ')[0]) : ''} · ${FS.mode === 'demo' ? 'sample data' : 'shared folder ' + esc(FS.name)}</span>
      <h1>${DOWL[d.getDay()]} <b>${d.getDate()}</b> ${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][d.getMonth()]}</h1>
      <div class="sub">Day <b>${d.getDate()}</b> of ${dimOf(t)} · <b>${open.length}</b> open incident${open.length === 1 ? '' : 's'} · readings ${logged.length ? `<b>${logged.length}/${rows.length}</b> logged by ${esc(lastBy.by.name)} at <b>${hhmm(lastBy.at)}</b>` : `<b>not logged yet</b>`}</div>
      <div class="hstack" style="margin-top:4px">
        <button class="btn pri" data-act="log-occ">Log a failure <kbd>L</kbd></button>
        <button class="btn" data-act="go-log">Morning readings <kbd>R</kbd></button>
        <button class="btn ghost" data-act="copy-summary">Copy morning summary</button>
      </div>
      <button class="bigsearch" data-act="palette"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>A job failed? Type its name — see what caused it before<span class="caret"></span><kbd>Ctrl K</kbd></button>
    </div>
    <div class="radar"><canvas data-ch="radar"></canvas></div>
  </section>
  ${banners.length ? `<div class="banners mt rise">${banners.join('')}</div>` : ''}
  <div class="g g-73 mt">
    <div class="stack">
      ${unit('Today’s readings', rows.length ? `<table class="tbl"><thead><tr><th>System</th><th class="num">Failed jobs</th><th></th><th class="num">Dumps</th><th></th><th></th></tr></thead><tbody>${readRows}</tbody></table>` : emptyState('No systems yet', 'Add the system/client combinations you monitor (for example P01 / 100).', '<button class="btn" data-act="add-sys">Add a system</button>'), { meta: `<button class="btn sm" data-act="go-log">${logged.length ? 'Edit' : 'Log'} readings</button>`, p: 'pen-6' })}
      ${unit('Open incidents', open.length ? openRows + (open.length > 8 ? `<div class="row link" data-go="occ"><span class="nm dim">+ ${open.length - 8} more…</span><span></span></div>` : '') : emptyState('Nothing open', 'Every logged incident is resolved or marked as expected.'), { meta: `${open.length} open`, p: 'pen-4' })}
    </div>
    <div class="stack">
      ${unit('Known causes that fit today', active.length ? activeRows : emptyState('None time-bound for today', 'Causes with a “when it happens” window (like days 20 – month end) show up here on the days they apply.'), { meta: esc(fmtD(t)), p: 'pen-3' })}
      ${unit('Team activity', acts || emptyState('Quiet so far', 'Saves by anyone on the team appear here.'), { meta: `${S().people.size} people`, p: 'ink-2' })}
    </div>
  </div>`;
}

/* ------------------------------------------------------------- morning readings */
function vLog() {
  const date = UI.logDate || today();
  const rows = sysList();
  const lockT = 'readings:' + date;
  const held = lockHolder(lockT);
  const body = rows.length ? `<table class="tbl rgrid" id="rgrid" data-date="${date}"><thead><tr><th>System / client</th><th class="num">Failed jobs</th><th>vs normal</th><th class="num">Dumps</th><th>vs normal</th><th style="width:34%">Note (optional)</th><th>Last saved</th></tr></thead><tbody>${rows.map(x => {
    const r = S().readings.get(date + '|' + x.key);
    const dr = UI.draft?.[date + '|' + x.key] || {};
    const num = k => dr[k] !== undefined ? (dr[k] === '' ? null : +dr[k]) : r?.[k];
    const fF = readingFlag(x.key, 'failed', date, num('failed')), fD = readingFlag(x.key, 'dumps', date, num('dumps'));
    const exF = fF.ex || expected(x.key, 'failed', date), exD = fD.ex || expected(x.key, 'dumps', date);
    return `<tr data-sys="${esc(x.key)}" data-rev="${esc(r?.rev || '')}">
      <td><span class="nm">${esc(x.key)}</span><div class="sub">${esc(x.label)}</div></td>
      <td class="num"><input class="inp" inputmode="numeric" data-k="failed" value="${esc(dr.failed ?? r?.failed ?? '')}" placeholder="${exF ? '~' + Math.round(exF.med) : ''}"></td>
      <td><span class="flag ${fF.k}" data-flag="failed">${esc(fF.t)}</span></td>
      <td class="num"><input class="inp" inputmode="numeric" data-k="dumps" value="${esc(dr.dumps ?? r?.dumps ?? '')}" placeholder="${exD ? '~' + Math.round(exD.med) : ''}"></td>
      <td><span class="flag ${fD.k}" data-flag="dumps">${esc(fD.t)}</span></td>
      <td><input class="inp note-inp" data-k="note" value="${esc(dr.note ?? r?.note ?? '')}" placeholder="e.g. RFC to BW down 02:00–03:10"></td>
      <td>${r ? whoLine(r.by, r.at) : '<span class="dim">—</span>'}${r?.conflict ? `<div class="flag hi" title="Saved at the same time as ${esc(r.conflict.by.name)}">⚠ ${esc(r.conflict.by.name)} had ${r.conflict.failed ?? '–'}/${r.conflict.dumps ?? '–'}</div>` : ''}</td></tr>`;
  }).join('')}</tbody></table>
  <div class="hstack" style="margin-top:14px"><button class="btn pri" data-act="save-readings">Save readings <kbd>Ctrl S</kbd></button><span class="dim" style="font-size:11px">Leave a box blank if you didn't check it. 0 means checked, none. Grey numbers are what's normal for this day.</span></div>`
    : emptyState('No systems yet', 'Add each system / client combination from the monitoring email once. After that this page is a quick grid to fill in every morning.', '<button class="btn pri" data-act="add-sys">Add a system</button>');
  MIRROR_MAX = null;
  const mx = { d: 1, f: 1 };
  for (const x of rows) { const a = series('dumps', x.key, addDays(today(), -59), today()), b = series('failed', x.key, addDays(today(), -59), today()); mx.d = Math.max(mx.d, ...a.values()); mx.f = Math.max(mx.f, ...b.values()); }
  MIRROR_MAX = mx;
  const multiples = rows.map(x => `<div style="display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:6px 0;border-top:1px dotted var(--rule-strong)"><div><div class="mono" style="font-size:12px;font-weight:600">${esc(x.key)}</div><div class="dim" style="font-size:10.5px" class="clip">${esc(x.label)}</div></div><canvas data-ch="mirror" data-sys="${esc(x.key)}" data-days="60" data-shared="1" style="width:100%;height:54px"></canvas></div>`).join('');
  return `<div class="th rise" style="--pen:var(--pen-6)"><div><div class="no">02 · MORNING READINGS</div><h1>${esc(fmtD(date))} ${pd(date).getFullYear()} <span>numbers from the daily job-monitoring email</span></h1></div>
    <div class="acts">${lockBadge(lockT)}<button class="btn sm" data-act="log-day" data-d="-1">‹ Prev day</button><input type="date" class="inp" style="width:150px" id="logDate" value="${date}" max="${today()}"><button class="btn sm" data-act="log-day" data-d="1" ${date >= today() ? 'disabled' : ''}>Next day ›</button>${date !== today() ? '<button class="btn sm" data-act="log-day" data-d="0">Today</button>' : ''}<button class="btn sm ghost" data-act="copy-summary" data-date="${date}">Copy summary</button></div></div>
    ${held ? `<div class="banner rise" style="--pen:var(--pen-4);margin-bottom:14px"><span class="ic"></span><span><b>${esc(held.name)}</b> is entering readings for this day too (since ${hhmm(held.at)}). Saving is safe — if you both enter different numbers for the same system you'll be asked which to keep.</span><span></span></div>` : ''}
    ${unit('Readings by system', body, { meta: `${rows.length} systems`, p: 'pen-6' })}
    ${rows.length ? `<div class="mt">${unit('Last 60 days', `<div class="legend" style="margin-bottom:6px"><span style="--pen:var(--pen-1)"><i></i>dumps (up)</span><span style="--pen:var(--pen-2)"><i></i>failed jobs (down)</span><span>same scale for every system</span></div>${multiples}`, { p: 'pen-5', meta: 'hover for numbers' })}</div>` : ''}`;
}

/* ------------------------------------------------------------- knowledge base */
function entryText(e) {
  return [e.name, e.title, e.desc, e.area, e.owner, e.contact, (e.tags || []).join(' '), (e.systems || []).join(' '),
    ...[...e.causes.values()].map(c => [c.title, c.check, c.fix, c.contact, winText(c.win)].join(' ')),
    ...e.notes.map(n => n.text), ...e.occs.map(o => o.note + ' ' + o.ref + ' ' + o.log.map(l => l.text).join(' '))].join(' \n ').toLowerCase();
}
function matchQ(text, q) { const toks = q.toLowerCase().split(/\s+/).filter(Boolean); return toks.every(t => text.includes(t)); }
function vKb() {
  const f = UI.kb;
  const all = liveEntries();
  let list = all.filter(e => (f.arch || !e.archived) && (f.kind === 'all' || e.kind === f.kind) && (!f.sys || !e.systems?.length || e.systems.includes(f.sys)));
  if (f.q) list = list.filter(e => matchQ(entryText(e), f.q));
  const t = today();
  list.sort(f.sort === 'name' ? (a, b) => a.name.localeCompare(b.name) : f.sort === 'freq' ? (a, b) => b.n90 - a.n90 || b.occs.length - a.occs.length : f.sort === 'seen' ? (a, b) => (b.lastSeen || '').localeCompare(a.lastSeen || '') : (a, b) => b.updated.localeCompare(a.updated));
  const cnt = k => all.filter(e => !e.archived && (k === 'all' || e.kind === k)).length;
  const days = 45;
  const rows = list.map(e => {
    const spark = Array(days).fill(0); const from = addDays(t, -days + 1);
    for (const o of e.occs) if (o.date >= from) spark[daysBetween(from, o.date)]++;
    const live = [...e.causes.values()].filter(c => !c.retired);
    const nowC = live.filter(c => !winIsAny(c.win) && winMatch(c.win, t)).length;
    return `<tr class="link" data-entry="${esc(e.id)}"><td>${kindBadge(e.kind)}</td>
      <td><div class="nm">${esc(e.name)}${e.archived ? ' <span class="dim" style="font-weight:400">(archived)</span>' : ''}${e.conflicts.length ? ' <span class="flag hi">⚠ clash</span>' : ''}${e.dups?.length ? ' <span class="flag hi">⚠ duplicate</span>' : ''}</div><div class="sub">${esc(e.title || e.desc || '')}</div></td>
      <td class="num">${live.length}${nowC ? ` <span class="today-tag yes" title="Causes whose window includes today">${nowC} today</span>` : ''}</td>
      <td>${dotSpark(spark, pen(KINDS[e.kind]?.pen || 'ink'))}</td>
      <td class="num">${e.n90 || '<span class="dim">0</span>'}</td>
      <td class="mono" style="font-size:11px">${e.lastSeen ? esc(fmtShort(e.lastSeen)) : '<span class="dim">never</span>'}</td>
      <td>${sysChips((e.systems || []).slice(0, 3))}${e.systems?.length > 3 ? ` <span class="dim">+${e.systems.length - 3}</span>` : ''}</td>
      <td>${whoLine(e.updatedBy, e.updated)}</td></tr>`;
  }).join('');
  return `<div class="th rise" style="--pen:var(--pen-3)"><div><div class="no">03 · KNOWLEDGE BASE</div><h1>Jobs &amp; dumps <span>${all.filter(e => !e.archived).length} entries · ${all.reduce((n, e) => n + [...e.causes.values()].filter(c => !c.retired).length, 0)} known causes</span></h1></div>
    <div class="acts"><button class="btn" data-act="log-occ">Log a failure <kbd>L</kbd></button><button class="btn pri" data-act="new-entry">New entry <kbd>N</kbd></button></div></div>
    <section class="unit rise" style="--pen:var(--pen-3);margin-bottom:var(--gap)"><div class="hstack">
      <input class="inp sans" id="kbQ" style="flex:1;min-width:240px;height:34px;font-size:13px" placeholder="Search names, causes, how-to-check notes, findings…" value="${esc(f.q)}" autocomplete="off">
      <div class="chips">${['all', 'job', 'dump', 'other'].map(k => `<button class="chip ${f.kind === k ? 'on' : ''}" data-act="kb-kind" data-k="${k}" ${k !== 'all' ? `style="--pen:${pen(KINDS[k].pen)}"` : ''}>${k !== 'all' ? '<i></i>' : ''}${k === 'all' ? 'All' : KINDS[k].label + 's'} <span class="n">${cnt(k)}</span></button>`).join('')}</div>
      <select class="inp" id="kbSys" style="width:auto"><option value="">All systems</option>${sysList().map(x => `<option value="${esc(x.key)}" ${f.sys === x.key ? 'selected' : ''}>${esc(x.key)}</option>`).join('')}</select>
      <select class="inp" id="kbSort" style="width:auto">${[['recent', 'Recently updated'], ['seen', 'Recently failed'], ['freq', 'Most frequent (90 d)'], ['name', 'Name A–Z']].map(([k, l]) => `<option value="${k}" ${f.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="chip ${f.arch ? 'on' : ''}" data-act="kb-arch">Archived</button>
    </div></section>
    ${unit(f.q ? `Matches for “${esc(f.q)}”` : 'Entries', list.length ? `<table class="tbl"><thead><tr><th>Type</th><th>Name</th><th class="num">Causes</th><th>Last ${days} days</th><th class="num">90 d</th><th>Last failed</th><th>Systems</th><th>Updated</th></tr></thead><tbody>${rows}</tbody></table>`
      : f.q ? emptyState('Nothing found', `No entry mentions “${esc(f.q)}”. If it's new, create it so the next person finds it.`, `<button class="btn pri" data-act="new-entry" data-name="${esc(f.q.toUpperCase())}">Create “${esc(f.q.toUpperCase())}”</button>`)
        : emptyState('No entries yet', 'Each job or dump the team investigates gets an entry: what it is, the known causes, how to check and what to do.', '<button class="btn pri" data-act="new-entry">New entry</button>'), { meta: `${list.length} shown`, p: 'pen-3' })}`;
}

/* ------------------------------------------------------------- entry detail */
function causeCard(e, c, t) {
  const fits = winMatch(c.win, t), timed = !winIsAny(c.win);
  const why = !fits ? (c.win?.type === 'dom' || c.win?.type === 'end' || c.win?.type === 'start' ? `not today — today is the ${ord(domOf(t))}` : c.win?.type === 'wd' ? `not today — it's ${DOWL[pd(t).getDay()]}` : 'not this month') : '';
  return `<div class="cause ${fits ? '' : 'off'}" style="--pen:${pen(ACTIONS[c.action]?.pen || 'ink-3')}">
    <div class="ct"><b>${esc(c.title)}</b><span>${timed ? (fits ? `<span class="today-tag yes">fits today</span>` : `<span class="today-tag no">${esc(why)}</span>`) : ''}</span></div>
    <div class="cm"><span class="chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>${esc(winText(c.win))}</span>${actChip(c.action)}${c.systems?.length ? sysChips(c.systems) : '<span class="dim" style="font-size:10.5px">all systems</span>'}${c.contact ? `<span class="chip">→ ${esc(c.contact)}</span>` : ''}</div>
    ${c.check ? `<div class="chk">${esc(c.check)}</div>` : ''}
    ${c.fix ? `<div class="chk fx">${esc(c.fix)}</div>` : ''}
    <div class="foot"><span>seen <b style="color:var(--ink)">${c.seen}×</b>${c.lastSeen ? ' · last ' + esc(fmtShort(c.lastSeen)) : ''}</span><span>added by ${esc(c.createdBy?.name || '?')} ${esc(fmtShort(isoLocalDate(c.created)))}</span>${c.updated !== c.created ? `<span>edited by ${esc(c.updatedBy?.name || '?')} ${esc(rel(c.updated))}</span>` : ''}<span class="sp"></span>
      <button class="btn sm" data-act="log-occ" data-entry-id="${esc(e.id)}" data-cause="${esc(c.id)}" title="Log today's failure with this cause">This was it</button>
      <button class="btn sm ghost" data-act="edit-cause" data-cause="${esc(c.id)}">Edit</button>
      <button class="btn sm ghost" data-act="retire-cause" data-cause="${esc(c.id)}">${c.retired ? 'Reinstate' : 'Retire'}</button></div>
  </div>`;
}
function vEntry() {
  const e = entryOf(S(), UI.entry);
  if (!e) return emptyState('Entry not found', 'It may still be syncing from the shared folder.', '<button class="btn" data-go="kb">Back to the knowledge base</button>');
  if (e.id !== UI.entry) UI.entry = e.id;
  const t = today();
  const causes = [...e.causes.values()];
  const live = causes.filter(c => !c.retired), retired = causes.filter(c => c.retired);
  live.sort((a, b) => (winMatch(b.win, t) - winMatch(a.win, t)) || (b.seen - a.seen) || a.created.localeCompare(b.created));
  const fitN = live.filter(c => winMatch(c.win, t)).length;
  const conflicts = e.conflicts.map(cf => {
    const c = cf.where.causeId ? e.causes.get(cf.where.causeId) : null;
    const show = v => cf.field === 'win' ? winText(v) : cf.field === 'action' ? ACTIONS[v]?.label || v : cf.field === 'kind' ? KINDS[v]?.label || v : Array.isArray(v) ? v.join(', ') : String(v ?? '');
    return `<div class="conflict"><div><b>${esc(FIELD_LABEL[cf.field] || cf.field)}</b>${c ? ` of cause “${esc(c.title)}”` : ''} was changed by <b>${esc(cf.wonBy.name)}</b> at ${esc(rel(cf.at))} without seeing <b>${esc(personName(cf.lostBy))}</b>'s change from ${esc(rel(cf.lostAt))}. Now showing ${esc(cf.wonBy.name)}'s. The other version was:</div><div class="old">${esc(show(cf.lost)) || '<i>(empty)</i>'}</div><div class="hstack"><button class="btn sm" data-act="cf-keep" data-cid="${esc(cf.id)}">Keep current</button><button class="btn sm" data-act="cf-restore" data-cid="${esc(cf.id)}">Use the other version</button></div></div>`;
  }).join('');
  const occRows = e.occs.slice(0, 40).map(o => {
    const c = e.causes.get(o.causeId);
    return `<tr class="link" data-occ="${esc(o.id)}"><td class="mono" style="font-size:11px">${esc(fmtShort(o.date))}</td><td><span class="sysc">${esc(o.sys || '—')}</span></td><td>${c ? `<span style="color:${pen(ACTIONS[c.action]?.pen || 'ink')}">●</span> ${esc(c.title)}` : '<span class="dim">not identified</span>'}</td><td>${statusChip(o.status)}</td><td class="clip" style="max-width:280px;color:var(--ink-2)">${esc(o.note)}</td><td>${whoLine(o.by, o.at)}</td></tr>`;
  }).join('');
  const notes = e.notes.slice().reverse().map(n => `<div class="msg"><span class="av">${esc(initials(n.by.name))}</span><div><div class="mh"><b>${esc(n.by.name)}</b>${esc(rel(n.at))}</div><div class="mt2">${esc(n.text)}</div></div></div>`).join('');
  const hist = S().activity.filter(a => a.ref?.entry === e.id).slice(0, 12).map(a => `<div class="act"><span class="t">${esc(rel(a.at))}</span><span class="p" style="--pen:var(--ink-3)"></span><span class="x"><b>${esc(a.by.name)}</b> ${a.text}</span></div>`).join('');
  const legend = Object.entries(ACTIONS).filter(([k]) => e.occs.some(o => e.causes.get(o.causeId)?.action === k)).map(([k, a]) => `<span style="--pen:${pen(a.pen)}"><i></i>${esc(a.short)}</span>`).join('') + (e.occs.some(o => !e.causes.get(o.causeId)) ? `<span style="--pen:var(--pen-4)"><i></i>cause not identified</span>` : '');
  return `
  <div class="rise" style="margin-bottom:10px"><button class="btn sm ghost" data-go="kb">← Knowledge base</button></div>
  <div class="ehead rise" style="--pen:${pen(KINDS[e.kind]?.pen)}">
    <div style="min-width:0;flex:1">
      <div class="hstack">${kindBadge(e.kind)}${e.crit !== 'normal' ? `<span class="kb" style="--pen:${e.crit === 'critical' || e.crit === 'high' ? 'var(--bad)' : 'var(--ink-3)'}"><i></i>${esc(CRIT[e.crit])} criticality</span>` : ''}${e.archived ? '<span class="kb" style="--pen:var(--ink-4)"><i></i>Archived</span>' : ''}${lockBadge('entry:' + e.id)}</div>
      <h1>${esc(e.name)}</h1>
      <div class="ttl">${esc(e.title)}</div>
      <div class="facts">${e.systems?.length ? sysChips(e.systems) : '<span class="dim" style="font-size:11px">runs on: not set</span>'}${e.area ? `<span class="chip">${esc(e.area)}</span>` : ''}${e.owner ? `<span class="chip">owner: ${esc(e.owner)}</span>` : ''}${e.contact ? `<span class="chip">escalate to: ${esc(e.contact)}</span>` : ''}${(e.tags || []).map(x => `<span class="chip">#${esc(x)}</span>`).join('')}</div>
    </div>
    <div class="acts hstack"><button class="btn pri" data-act="log-occ" data-entry-id="${esc(e.id)}">Log a failure <kbd>L</kbd></button><button class="btn" data-act="add-cause">+ Known cause</button><button class="btn" data-act="edit-entry">Edit</button><button class="btn ghost" data-act="copy-entry">Copy summary</button><button class="btn ghost" data-act="entry-more">More…</button></div>
  </div>
  ${e.dups?.length ? `<div class="banner rise" style="--pen:var(--pen-5);margin-bottom:12px"><span class="ic"></span><span>There is another entry with the same name (created by ${esc(e.dups.map(id => S().entries.get(id)?.createdBy?.name).join(', '))}). Merge them so causes and history live in one place.</span><button class="btn sm" data-act="merge" data-other="${esc(e.dups[0])}">Merge…</button></div>` : ''}
  ${conflicts ? `<div class="rise" style="display:grid;gap:8px;margin-bottom:12px">${conflicts}</div>` : ''}
  <div class="g g-84">
    <div class="stack">
      ${unit(`Known causes <span class="dim" style="letter-spacing:.1em">· checked against today, ${esc(fmtD(t))}</span>`, live.length ? `<div style="display:grid;gap:10px">${live.map(c => causeCard(e, c, t)).join('')}</div>` + (retired.length ? `<div style="margin-top:12px"><button class="btn sm ghost" data-act="toggle-retired">${UI.showRetired ? 'Hide' : 'Show'} ${retired.length} retired cause${retired.length === 1 ? '' : 's'}</button>${UI.showRetired ? `<div style="display:grid;gap:10px;margin-top:10px;opacity:.7">${retired.map(c => causeCard(e, c, t)).join('')}</div>` : ''}</div>` : '')
        : emptyState('No known causes yet', 'When you find out why it failed, add it here — with when it happens, how to check, and what to do — so the next person knows.', '<button class="btn pri" data-act="add-cause">+ Add the first cause</button>'), { meta: live.length ? `${fitN} of ${live.length} fit today` : '', p: 'pen-3' })}
      ${unit('Incidents', `<div class="legend" style="margin-bottom:4px">${legend || '<span>no incidents logged yet</span>'}</div><canvas class="strip" data-ch="strip"></canvas>${e.occs.length ? `<table class="tbl" style="margin-top:8px"><thead><tr><th>Date</th><th>System</th><th>Cause</th><th>Status</th><th>Note</th><th>Logged</th></tr></thead><tbody>${occRows}</tbody></table>` : ''}`, { meta: `${e.occs.length} total · ${e.n90} in 90 days`, p: 'pen-4' })}
    </div>
    <div class="stack">
      ${unit('About', `${e.desc ? `<div class="desc">${esc(e.desc)}</div>` : '<div class="dim" style="font-size:12px">No notes yet. <button class="btn sm ghost" data-act="edit-entry">Add some</button></div>'}<div class="readouts" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="ro"><span class="k">Incidents</span><span class="v">${e.occs.length}</span></div><div class="ro"><span class="k">Last failed</span><span class="v" style="font-size:13px">${e.lastSeen ? esc(fmtShort(e.lastSeen)) : '—'}</span></div><div class="ro"><span class="k">Open</span><span class="v">${e.open}</span></div></div><div class="note"><span class="ring"></span><span>Created by <b>${esc(e.createdBy.name)}</b> ${esc(fmtDY(isoLocalDate(e.created)))} · last change by <b>${esc(e.updatedBy.name)}</b> ${esc(rel(e.updated))}</span></div>`, { p: 'ink-2' })}
      ${unit('When it fails', e.occs.length ? `<canvas class="chart" data-ch="occdom" style="height:90px"></canvas><div class="dim" style="font-size:10.5px;margin-top:6px">Incidents by day of the month — a cluster tells you it's tied to a calendar event.</div>` : '<div class="dim" style="font-size:12px">Shows up once incidents are logged.</div>', { p: 'pen-5', meta: 'day of month' })}
      ${unit('Findings &amp; notes', `<div class="field"><textarea class="inp" id="noteIn" rows="3" placeholder="What did you find? e.g. “Failed again on the 10th — RFC to BW was down, rerun after Basis fixed it.”">${esc(UI.noteDraft?.[e.id] || '')}</textarea><div class="hstack"><span class="dim" style="font-size:10.5px">Ctrl Enter to add</span><span class="sp"></span><button class="btn sm pri" data-act="add-note">Add note</button></div></div><div class="thread" style="margin-top:12px">${notes || ''}</div>`, { meta: `${e.notes.length}`, p: 'pen-2' })}
      ${unit('History', hist || '<div class="dim" style="font-size:12px">—</div>', { p: 'ink-3' })}
    </div>
  </div>`;
}

/* ------------------------------------------------------------- incidents */
function vOcc() {
  const f = UI.occ, t = today();
  const from = f.range === 'all' ? '0000' : addDays(t, -(+f.range) + 1);
  let list = [...S().occs.values()].filter(o => !o.void && entryOf(S(), o.entryId));
  const cnt = k => list.filter(o => o.date >= from && (k === 'all' || (k === 'active' ? (o.status === 'open' || o.status === 'escalated') : o.status === k))).length;
  list = list.filter(o => o.date >= from && (f.status === 'all' || (f.status === 'active' ? (o.status === 'open' || o.status === 'escalated') : o.status === f.status)) && (!f.sys || o.sys === f.sys) && (!f.who || o.by.id === f.who));
  if (f.q) list = list.filter(o => { const e = entryOf(S(), o.entryId), c = e.causes.get(o.causeId); return matchQ([e.name, e.title, c?.title, o.note, o.ref, o.sys, o.by.name, ...o.log.map(l => l.text)].join(' ').toLowerCase(), f.q); });
  list.sort((a, b) => b.date.localeCompare(a.date) || b.at.localeCompare(a.at));
  const rows = list.slice(0, 400).map(o => {
    const e = entryOf(S(), o.entryId), c = e.causes.get(o.causeId);
    return `<tr class="link" data-occ="${esc(o.id)}"><td class="mono" style="font-size:11px;white-space:nowrap">${esc(fmtD(o.date))}</td><td><span class="sysc">${esc(o.sys || '—')}</span></td><td>${kindBadge(e.kind)} <span class="nm">${esc(e.name)}</span>${o.count > 1 ? ` <span class="dim mono">×${o.count}</span>` : ''}</td><td>${c ? esc(c.title) : '<span class="dim">not identified</span>'}${c ? `<div class="sub">${esc(ACTIONS[c.action]?.label || '')}</div>` : ''}</td><td>${statusChip(o.status)}</td><td class="clip" style="max-width:260px;color:var(--ink-2)">${esc(o.note)}${o.log.length ? ` <span class="dim">· ${o.log.length} update${o.log.length === 1 ? '' : 's'}</span>` : ''}</td><td>${whoLine(o.by, o.at)}</td></tr>`;
  }).join('');
  const people = [...S().people.values()];
  return `<div class="th rise" style="--pen:var(--pen-4)"><div><div class="no">04 · INCIDENTS</div><h1>Incident log <span>what failed, why, and what was done about it</span></h1></div>
    <div class="acts"><button class="btn ghost" data-act="export-occ">Export CSV</button><button class="btn pri" data-act="log-occ">Log a failure <kbd>L</kbd></button></div></div>
    <section class="unit rise" style="--pen:var(--pen-4);margin-bottom:var(--gap)"><div class="hstack">
      <input class="inp sans" id="occQ" style="flex:1;min-width:200px;height:34px;font-size:13px" placeholder="Search jobs, causes, notes, ticket refs…" value="${esc(f.q)}" autocomplete="off">
      <div class="chips">${[['active', 'Open'], ['all', 'All'], ['open', 'Investigating'], ['escalated', 'Escalated'], ['resolved', 'Resolved'], ['ignored', 'Expected']].map(([k, l]) => `<button class="chip ${f.status === k ? 'on' : ''}" data-act="occ-status" data-k="${k}" ${STATUS[k] ? `style="--pen:${pen(STATUS[k].pen)}"` : ''}>${STATUS[k] ? '<i></i>' : ''}${l} <span class="n">${cnt(k)}</span></button>`).join('')}</div>
      <select class="inp" id="occSys" style="width:auto"><option value="">All systems</option>${sysList(true).map(x => `<option value="${esc(x.key)}" ${f.sys === x.key ? 'selected' : ''}>${esc(x.key)}</option>`).join('')}</select>
      <select class="inp" id="occWho" style="width:auto"><option value="">Anyone</option>${people.map(p => `<option value="${esc(p.id)}" ${f.who === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
      <select class="inp" id="occRange" style="width:auto">${[['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['365', 'Last year'], ['all', 'Everything']].map(([k, l]) => `<option value="${k}" ${String(f.range) === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div></section>
    ${unit('Incidents', list.length ? `<table class="tbl"><thead><tr><th>Date</th><th>System</th><th>Job / dump</th><th>Cause</th><th>Status</th><th>Note</th><th>Logged by</th></tr></thead><tbody>${rows}</tbody></table>${list.length > 400 ? `<div class="dim" style="font-size:11px;margin-top:8px">Showing the newest 400 of ${list.length}. Narrow the filters to see more.</div>` : ''}` : emptyState('No incidents match', f.status === 'active' ? 'Nothing is open right now.' : 'Try a wider date range or another filter.'), { meta: `${list.length}`, p: 'pen-4' })}`;
}

/* ------------------------------------------------------------- trends */
function vTrends() {
  const f = UI.tr;
  const pr = domProfile(f.metric, f.sys || null, f.months);
  const has = readingDates().length;
  const mlabel = METRIC[f.metric].label.toLowerCase();
  const hotList = pr.hot.length ? pr.hot.map(h => `<div class="row"><span class="nm" style="white-space:normal;line-height:1.5"><b>${esc(hotText(h))}</b><br><span class="mono">${h.inMean.toFixed(1)}</span> ${mlabel}/day vs <span class="mono">${h.outMean.toFixed(1)}</span> on other days</span><span class="val" style="color:var(--pen-4)">${h.factor.toFixed(1)}× ${dotBar(Math.min(1, (h.factor - 1) / 2), 10, 'var(--pen-4)')}</span></div>`).join('')
    : `<div class="dim" style="font-size:12px;line-height:1.6">${pr.days < 40 ? `Needs about 40 days of readings to spot patterns (have ${pr.days}).` : 'No stretch of the month stands out — days look similar.'}</div>`;
  /* most frequent */
  const t = today(), from = addDays(t, -89);
  const top = liveEntries().map(e => ({ e, n: e.occs.filter(o => o.date >= from && (!f.sys || o.sys === f.sys)).length })).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 10);
  const topMax = Math.max(1, ...top.map(x => x.n));
  const mix = {}; let unk = 0, tot = 0;
  for (const o of S().occs.values()) { if (o.void || o.date < from || (f.sys && o.sys !== f.sys)) continue; const e = entryOf(S(), o.entryId); if (!e) continue; const c = e.causes.get(o.causeId); tot++; if (c) mix[c.action] = (mix[c.action] || 0) + 1; else unk++; }
  const mixRows = Object.entries(ACTIONS).map(([k, a]) => `<div class="row"><span class="nm" style="--pen:${pen(a.pen)}"><span style="color:${pen(a.pen)}">●</span> ${esc(a.label)}</span><span class="val">${mix[k] || 0} ${dotBar((mix[k] || 0) / Math.max(1, tot), 14, pen(a.pen))}</span></div>`).join('') + `<div class="row"><span class="nm"><span style="color:var(--pen-4)">●</span> Cause not identified</span><span class="val">${unk} ${dotBar(unk / Math.max(1, tot), 14, 'var(--pen-4)')}</span></div>`;
  const people = [...S().people.values()].map(p => ({ p, n: [...S().occs.values()].filter(o => o.by.id === p.id && o.date >= from).length + [...S().readings.values()].filter(r => r.by.id === p.id && r.date >= from).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const pMax = Math.max(1, ...people.map(x => x.n));
  MIRROR_MAX = null;
  return `<div class="th rise" style="--pen:var(--pen-5)"><div><div class="no">05 · TRENDS</div><h1>Trends <span>when do problems come — and where</span></h1></div>
    <div class="acts">
      <div class="chips">${Object.entries(METRIC).map(([k, m]) => `<button class="chip ${f.metric === k ? 'on' : ''}" data-act="tr-metric" data-m="${k}" style="--pen:${pen(m.pen)}"><i></i>${m.label}</button>`).join('')}</div>
      <select class="inp" id="trSys" style="width:auto"><option value="">All systems (sum)</option>${sysList(true).map(x => `<option value="${esc(x.key)}" ${f.sys === x.key ? 'selected' : ''}>${esc(x.key)}${x.label ? ' · ' + esc(x.label) : ''}</option>`).join('')}</select>
      <div class="chips">${[3, 6, 12].map(m => `<button class="chip ${f.months === m ? 'on' : ''}" data-act="tr-months" data-m="${m}">${m} mo</button>`).join('')}</div>
    </div></div>
    ${!has ? emptyState('No readings yet', 'Trends are built from the morning readings. Log a few weeks and patterns start to appear here.', '<button class="btn pri" data-act="go-log">Log readings</button>') : `
    <div class="g g-84">
      ${unit(`${METRIC[f.metric].label} by day of the month`, `<canvas class="chart" data-ch="dom" style="height:250px"></canvas>`, { meta: `avg per day · ${f.sys || 'all systems'} · ${pr.days} days of data`, p: METRIC[f.metric].pen })}
      ${unit('Busy stretches', hotList + `<div class="note"><span class="ring"></span><span>A stretch is flagged when its days average at least <b>1.25×</b> the month as a whole. On those days Today shows a heads-up, and three days before it starts.</span></div>`, { p: 'pen-4', meta: `${pr.hot.length} found` })}
    </div>
    <div class="mt">${unit(`Calendar · ${METRIC[f.metric].label.toLowerCase()}`, `<canvas class="chart" data-ch="cal" style="height:150px"></canvas><div class="legend" style="margin-top:6px"><span>bigger dot = more</span><span>· tiny dot = no reading</span><span>· click a day to open its readings</span></div>`, { p: METRIC[f.metric].pen, meta: `last ${f.months} months` })}</div>
    <div class="g g2 mt">
      ${unit('Day of the week', `<canvas class="chart" data-ch="wd" style="height:150px"></canvas>`, { p: METRIC[f.metric].pen, meta: 'avg per day' })}
      ${unit('Month by month', `<canvas class="chart" data-ch="months" style="height:150px"></canvas><div class="legend" style="margin-top:6px"><span style="--pen:var(--pen-1)"><i></i>dumps / day</span><span style="--pen:var(--pen-2)"><i></i>failed jobs / day</span></div>`, { p: 'pen-5', meta: 'last 12 months' })}
    </div>
    <div class="mt">${unit('Every system · last 90 days', sysList().map(x => `<div style="display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;padding:6px 0;border-top:1px dotted var(--rule-strong)"><div><div class="mono" style="font-size:12px;font-weight:600">${esc(x.key)}</div><div class="dim clip" style="font-size:10.5px">${esc(x.label)}</div></div><canvas data-ch="mirror" data-sys="${esc(x.key)}" data-days="90" style="width:100%;height:58px"></canvas></div>`).join(''), { p: 'pen-5', meta: '<span style="color:var(--pen-1)">● dumps up</span> · <span style="color:var(--pen-2)">● failed jobs down</span> · each row on its own scale' })}</div>`}
    <div class="g g3 mt">
      ${unit('Most frequent · 90 days', top.length ? top.map(x => `<div class="row link" data-entry="${esc(x.e.id)}"><span class="nm">${kindBadge(x.e.kind)} <b class="mono">${esc(x.e.name)}</b></span><span class="val">${x.n} ${dotBar(x.n / topMax, 12, pen(KINDS[x.e.kind].pen))}</span></div>`).join('') : '<div class="dim" style="font-size:12px">No incidents in the last 90 days.</div>', { p: 'pen-3' })}
      ${unit('What we did about them', tot ? mixRows : '<div class="dim" style="font-size:12px">No incidents in the last 90 days.</div>', { p: 'pen-4', meta: `${tot} incidents` })}
      ${unit('Who did the monitoring', people.length ? people.map(x => `<div class="row"><span class="nm"><b>${esc(x.p.name)}</b> <span class="dim mono">${esc(x.p.id)}</span></span><span class="val">${x.n} ${dotBar(x.n / pMax, 12, 'var(--pen-2)')}</span></div>`).join('') + '<div class="note"><span class="ring"></span><span>Readings and incidents logged in the last 90 days.</span></div>' : '<div class="dim" style="font-size:12px">—</div>', { p: 'pen-2' })}
    </div>`;
}

/* ------------------------------------------------------------- settings */

  const folderBody = FS.status === 'connected'
    ? `<div class="row"><span class="nm">${FS.mode === 'demo' ? 'Sample data (kept in this browser only)' : 'Folder'}</span><span class="val"><b>${esc(FS.name)}</b></span></div>
