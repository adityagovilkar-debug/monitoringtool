<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoring Desk</title>
<style>
/* ======================================================================
   MONITORING DESK — Instrument White (paper) + Backlit (dark), Bench look.
   ====================================================================== */
:root{
  --paper:#FFFFFF; --paper-2:#FBFAF7; --grid-dot:#DEDDD6; --rule:#E7E6DF; --rule-strong:#D6D5CC;
  --ink:#12141A; --ink-2:#5A5E68; --ink-3:#9A9EA8; --ink-4:#C3C5CB;
  --pen-1:#D93A1E; --pen-2:#1B4FA0; --pen-3:#0E7C63; --pen-4:#B07500; --pen-5:#6B3FA0; --pen-6:#C2410C;
  --good:#0E7C63; --watch:#B07500; --bad:#D93A1E;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","Inter",system-ui,sans-serif;
  --r:3px; --gap:14px; --pen:var(--ink);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --paper:#0E0F12; --paper-2:#15161B; --grid-dot:#24262D; --rule:#1F2127; --rule-strong:#30333B;
  --ink:#E8E9EC; --ink-2:#A6AAB3; --ink-3:#6E727C; --ink-4:#383B43;
  --pen-1:#FF5A3C; --pen-2:#5B8DEF; --pen-3:#2BC29B; --pen-4:#E0A526; --pen-5:#A57BE8; --pen-6:#F07A3A;
  --good:#2BC29B; --watch:#E0A526; --bad:#FF5A3C;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--ink-2);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dim{color:var(--ink-3)}
.ink2{color:var(--ink-2)}
kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink-2);background:var(--paper)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border:3px solid var(--paper);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-columns:58px 1fr;grid-template-rows:42px 1fr 26px;height:100vh}
.tb{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px 0 16px;border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:5}
.wm{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.34em;font-weight:600;white-space:nowrap}
.wm em{font-style:normal;font-family:var(--sans);letter-spacing:.2em;font-size:8.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.mark{width:18px;height:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.mark i{width:4px;height:4px;border-radius:50%;background:var(--ink-4);transition:background .3s}
.mark i.on{background:var(--ink)}
.mark i.hot{background:var(--pen-1)}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:10px;height:26px;padding:0 8px 0 10px;border:1px solid var(--rule);border-radius:var(--r);color:var(--ink-3);font-size:11px;min-width:300px;transition:border-color .2s}
.cmdk:hover{border-color:var(--rule-strong);color:var(--ink-2)}
.cmdk kbd{margin-left:auto}
.tb-r{display:flex;align-items:center;gap:8px;height:100%}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:1px solid var(--rule);border-radius:var(--r);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap;transition:border-color .2s}
.pill:hover{border-color:var(--rule-strong);color:var(--ink)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}
.pill.ok i{background:var(--good)} .pill.warn i{background:var(--watch)} .pill.bad i{background:var(--bad)}
.pill.demo{border-style:dashed;color:var(--pen-5)} .pill.demo i{background:var(--pen-5)}
.iconbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2)}
.iconbtn:hover{background:var(--rule)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

.rail{grid-row:2/3;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;position:relative;background:var(--paper);z-index:4}
.rail .ind{position:absolute;left:0;top:0;width:2px;height:26px;background:var(--ink);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s}
.rb{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-3);transition:color .2s,background .2s}
.rb:hover{color:var(--ink);background:var(--paper-2)}
.rb.on{color:var(--ink)}
.rb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.rb .pd{position:absolute;right:6px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--pen);opacity:0;transition:opacity .2s}
.rb.on .pd,.rb:hover .pd{opacity:1}
.rb .cnt{position:absolute;right:2px;bottom:3px;font-family:var(--mono);font-size:8.5px;color:var(--pen);font-weight:600}
.rb .tip{position:absolute;left:46px;top:50%;transform:translate(-4px,-50%);opacity:0;pointer-events:none;white-space:nowrap;background:var(--ink);color:var(--paper);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:var(--r);transition:all .18s;z-index:10}
.rb:hover .tip{opacity:1;transform:translate(0,-50%)}
.rail .sep{width:22px;border-top:1px solid var(--rule);margin:6px 0}
.rail .grow{flex:1}

main{grid-row:2/3;position:relative;overflow:auto;background:var(--paper)}
.paper{position:fixed;inset:42px 0 26px 58px;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,var(--grid-dot) 1px,transparent 0);background-size:22px 22px;opacity:.55;-webkit-mask-image:radial-gradient(ellipse 130% 100% at 50% 0%,#000 30%,transparent 92%)}
.sb{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;background:var(--paper);z-index:5}
.sb .led{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--ink-4)}
.sb .r{margin-left:auto}
.sb button{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.sb button:hover{color:var(--ink)}
@keyframes pulse{50%{opacity:.25}}
.sb .led.busy{background:var(--pen-2);animation:pulse 1s infinite}

#view{position:relative;padding:22px 26px 60px;max-width:1560px;margin:0 auto}
#view.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------------------------------------------------------------- units */
.unit{position:relative;min-width:0;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px 15px}
.unit::before,.unit::after{content:"";position:absolute;width:7px;height:7px;border:solid var(--rule-strong);pointer-events:none;transition:width .3s,height .3s,border-color .3s}
.unit::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.unit::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.unit.hov:hover::before,.unit.hov:hover::after{width:16px;height:16px;border-color:var(--pen)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule)}
.head h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:8px}
.head h2 i{width:6px;height:6px;border-radius:50%;background:var(--pen)}
.meta{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sech{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.sech .lbl{white-space:nowrap}
.sech::after{content:"";flex:1;border-top:1px dotted var(--rule-strong)}
.readouts{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.ro{background:var(--paper);padding:8px 9px 9px;min-width:0}
.ro .k{display:block;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .v{display:block;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.ro .v small{font-size:10px;color:var(--ink-3);margin-left:3px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dotted var(--rule-strong);font-size:11.5px;min-width:0}
.row:first-child{border-top:0}
.row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm b{color:var(--ink);font-weight:600}
.row .val{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:10px;font-size:11px}
.row.link{cursor:pointer}
.row.link:hover .nm b{text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px}
.dbar{display:block;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:30px;padding:0 13px;border:1px solid var(--rule-strong);border-radius:var(--r);font-size:11px;letter-spacing:.04em;color:var(--ink);transition:all .18s;white-space:nowrap;background:var(--paper)}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover:not(:disabled){opacity:.88}
.btn.danger{color:var(--bad)}
.btn.sm{height:24px;padding:0 9px;font-size:10.5px}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--rule-strong)}
.btn kbd{font-size:9px;padding:0 4px;opacity:.75}
.btn.pri kbd{background:transparent;color:inherit;border-color:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:24px;padding:0 10px;border:1px solid var(--rule);border-radius:var(--r);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);transition:all .15s;display:inline-flex;align-items:center;gap:6px;background:var(--paper);white-space:nowrap}
button.chip:hover{border-color:var(--rule-strong);color:var(--ink)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--pen,var(--ink-3))}
.chip .n{color:var(--ink-3)}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field>.k{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.field>.k b{color:var(--bad);font-weight:600}
.field .hint{font-size:10.5px;color:var(--ink-3);line-height:1.45}
.inp{height:30px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);padding:0 10px;font-family:var(--mono);font-size:12px;outline:0;transition:border-color .2s;width:100%;min-width:0}
.inp:focus{border-color:var(--ink-2)}
.inp.sans{font-family:var(--sans)}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5;font-family:var(--sans);font-size:12.5px}
select.inp{padding:0 6px}
.inp.bad{border-color:var(--bad)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dotted var(--rule-strong);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.tog .sw{width:26px;height:14px;border:1px solid var(--rule-strong);border-radius:8px;position:relative;transition:all .2s;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--ink-4);transition:all .2s}
.tog.on .sw{border-color:var(--ink)}
.tog.on .sw::after{left:14px;background:var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--ink-3);font-size:11.5px;line-height:1.6;padding:26px 20px}
.empty b{color:var(--ink);font-size:14px;font-weight:600}
.note{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px 0 2px;font-size:11px;line-height:1.5;color:var(--ink-3)}
.note .ring{width:11px;height:11px;border:1px solid var(--ink-3);border-radius:50%;margin-top:2px}
.note b{color:var(--ink-2);font-weight:600}

/* tool header */
.th{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.th .no{font-family:var(--mono);font-size:11px;color:var(--pen);letter-spacing:.14em}
.th h1{margin:4px 0 0;font-size:26px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.th h1 span{font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.th .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ------------------------------------------------------------- layouts */
.g{display:grid;gap:var(--gap)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-73{grid-template-columns:7fr 5fr}
.g-84{grid-template-columns:8fr 4fr}
.g-48{grid-template-columns:4fr 8fr}
.mt{margin-top:var(--gap)}
.stack{display:grid;gap:var(--gap);align-content:start}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* hero */
.hero{min-height:236px;padding:0;overflow:hidden;display:flex}
.hero canvas.bg{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;padding:24px 28px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.hero h1{margin:2px 0 0;font-weight:500;font-size:32px;letter-spacing:-.015em}
.hero h1 b{font-family:var(--mono);font-weight:600}
.hero .sub{font-size:12px;color:var(--ink-2);line-height:1.6}
.hero .sub b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.radar{position:relative;width:340px;flex:none}
.radar canvas{position:absolute;inset:0;width:100%;height:100%}
.bigsearch{display:flex;align-items:center;gap:12px;width:min(560px,100%);height:40px;padding:0 12px 0 14px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper);color:var(--ink-3);font-size:12.5px;transition:border-color .2s;margin-top:auto}
.bigsearch:hover{border-color:var(--ink-2)}
.bigsearch kbd{margin-left:auto}
.bigsearch .caret{width:1px;height:16px;background:var(--ink);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* banners */
.banner{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--rule);border-left:2px solid var(--pen);border-radius:var(--r);font-size:12px;line-height:1.5;background:var(--paper)}
.banner .ic{width:8px;height:8px;border-radius:50%;background:var(--pen)}
.banner.pulse .ic{animation:pulse 1.6s infinite}
.banner b{font-weight:600}
.banner .mono{font-size:11px}
.banners{display:grid;gap:8px}

/* tags & badges */
.kb{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border:1px solid var(--rule-strong);border-radius:var(--r);font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--paper)}
.kb i{width:6px;height:6px;border-radius:50%;background:var(--pen)}
.kb.solid{border-color:var(--pen);color:var(--pen)}
.sysc{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--rule);border-radius:var(--r);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.who{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.lockb{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 9px;border:1px dashed var(--pen-4);border-radius:var(--r);color:var(--pen-4);font-size:10.5px;white-space:nowrap}
.lockb svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.lockb.mine{border-color:var(--pen-3);color:var(--pen-3)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 8px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px dotted var(--rule-strong);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.link{cursor:pointer;transition:background .15s}
.tbl tr.link:hover td{background:var(--paper-2)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl .nm{font-family:var(--mono);font-weight:600;font-size:12px}
.tbl .sub{color:var(--ink-3);font-size:11px;margin-top:2px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl input.inp{height:28px}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* knowledge entry */
.ehead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.ehead h1{margin:6px 0 4px;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.01em;word-break:break-all}
.ehead .ttl{font-size:14px;color:var(--ink-2)}
.ehead .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.desc{font-size:12.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap}
.cause{position:relative;padding:12px 14px 12px 16px;border:1px solid var(--rule);border-radius:var(--r);display:grid;gap:7px;background:var(--paper);transition:border-color .2s}
.cause::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;background:var(--pen,var(--ink-4));border-radius:1px}
.cause:hover{border-color:var(--rule-strong)}
.cause.off{opacity:.62}
.cause.off:hover{opacity:1}
.cause .ct{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.cause .ct b{font-size:13px;font-weight:600}
.cause .cm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cause .chk{font-size:12px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.cause .chk.fx::before{content:"Fix / workaround  "}
.cause .chk::before{content:"How to check  ";font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cause .foot{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--ink-3);flex-wrap:wrap}
.cause .foot .sp{flex:1}
.today-tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:var(--r);border:1px solid currentColor;white-space:nowrap}
.today-tag.yes{color:var(--pen-3)} .today-tag.no{color:var(--ink-3);border-style:dashed}
.thread{display:grid;gap:10px}
.msg{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:12px;line-height:1.55}
.av{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--ink-2);background:var(--paper-2)}
.msg .mh{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.msg .mh b{color:var(--ink);font-family:var(--sans);font-size:11.5px;font-weight:600;margin-right:6px}
.msg .mt2{white-space:pre-wrap;color:var(--ink-2)}
.conflict{border:1px dashed var(--pen-4);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;font-size:12px;line-height:1.5}
.conflict .old{white-space:pre-wrap;border-left:2px solid var(--ink-4);padding-left:10px;color:var(--ink-2);font-size:11.5px;max-height:120px;overflow:auto}

<script>
'use strict';
/* ======================================================================
   MONITORING DESK — shared knowledge base for daily SAP job & dump monitoring.
   Storage: a OneDrive-synced shared folder. Nothing is ever edited in place:
   every save is a NEW small file in events/YYYY-MM/, named by time + user, so two
   people can never overwrite each other. The current picture is rebuilt by replaying
   all events in time order. Soft locks (locks/*.json) warn people who open the same
   entry; field-level clash detection catches edits made at the same time anyway.
   ====================================================================== */
const APP = 'monitoring-desk', VER = '1.0.0', SCHEMA = 1;
const Q = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const rand = (n = 6) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const uid = p => p + '_' + Date.now().toString(36) + rand(4);
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY_OVERRIDE = /^\d{4}-\d{2}-\d{2}$/.test(Q.get('today') || '') ? Q.get('today') : null;
const today = () => TODAY_OVERRIDE || ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const dimOf = s => { const d = pd(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const domOf = s => +s.slice(8, 10);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const fmtD = s => { if (!s) return ''; const d = pd(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDY = s => { if (!s) return ''; const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { if (!s) return ''; const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]}` + (s.slice(0, 4) !== today().slice(0, 4) ? ` ${String(d.getFullYear()).slice(2)}` : ''); };
const isoLocalDate = iso => ymd(new Date(iso));
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function rel(iso) {
  if (!iso) return '';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 50) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  const d = isoLocalDate(iso), t = ymd(new Date());
  if (d === t) return hhmm(iso);
  if (d === addDays(t, -1)) return 'yesterday ' + hhmm(iso);
  return fmtShort(d);
}
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const initials = n => String(n || '?').split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('') || '?';
const normName = s => String(s || '').trim().toUpperCase().replace(/\s+/g, ' ');
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const pen = k => `var(--${k})`;

const store = {
  get(k, d) { try { const v = localStorage.getItem('md.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('md.' + k, JSON.stringify(v)); } catch { } },
};

/* ------------------------------------------------------------- vocab */
const KINDS = {
  job: { label: 'Job', long: 'Background job', pen: 'pen-2' },
  dump: { label: 'Dump', long: 'ABAP dump (runtime error)', pen: 'pen-1' },
  other: { label: 'Other', long: 'Other (RFC, interface, IDoc, system)', pen: 'pen-5' },
};
const ACTIONS = {
  ignore: { label: 'Can be ignored', short: 'Ignore', pen: 'ink-3' },
  self: { label: 'Fix it ourselves', short: 'Fix ourselves', pen: 'pen-3' },
  rerun: { label: 'Rerun / restart the job', short: 'Rerun', pen: 'pen-2' },
  escalate: { label: 'Notify seniors / escalate', short: 'Escalate', pen: 'pen-1' },
  team: { label: 'Hand over to another team', short: 'Other team', pen: 'pen-5' },
  monitor: { label: 'Watch it — act if it repeats', short: 'Monitor', pen: 'pen-4' },
};
const STATUS = {
  open: { label: 'Investigating', pen: 'pen-4' },
  escalated: { label: 'Escalated', pen: 'pen-1' },
  resolved: { label: 'Resolved', pen: 'pen-3' },
  ignored: { label: 'Expected / ignored', pen: 'ink-3' },
};
const CRIT = { low: 'Low', normal: 'Normal', high: 'High', critical: 'Critical' };
const ENTRY_FIELDS = ['kind', 'name', 'title', 'systems', 'area', 'owner', 'crit', 'desc', 'tags', 'contact'];
const CAUSE_FIELDS = ['title', 'win', 'systems', 'check', 'action', 'contact', 'fix'];
const FIELD_LABEL = { kind: 'Type', name: 'Name', title: 'Short description', systems: 'Systems', area: 'Area / module', owner: 'Owner', crit: 'Criticality', desc: 'Notes', tags: 'Tags', contact: 'Escalation contact', win: 'When it happens', check: 'How to check', action: 'What to do', fix: 'Fix / workaround' };

/* When-it-happens windows on a known cause. */
function winMatch(w, d) {
  if (!w) return true;
  const dt = pd(d), dom = dt.getDate(), dim = dimOf(d), wd = dt.getDay();
  if (w.months?.length && !w.months.includes(dt.getMonth() + 1)) return false;
  switch (w.type) {
    case 'dom': {
      const from = clamp(+w.from || 1, 1, 31), to = w.to === 'end' || !w.to ? dim : Math.min(+w.to, dim);
      return from <= to ? dom >= from && dom <= to : (dom >= from || dom <= to);
    }
    case 'end': return dom > dim - (+w.n || 3);
    case 'start': return dom <= (+w.n || 3);
    case 'wd': return !w.days?.length || w.days.includes(wd);
    default: return true;
  }
}
function winText(w) {
  if (!w) return 'Any day';
  let s;
  switch (w.type) {
    case 'dom': s = `Days ${w.from || 1}–${w.to === 'end' || !w.to ? 'month end' : w.to}`; break;
    case 'end': s = `Last ${w.n || 3} days of the month`; break;
    case 'start': s = `First ${w.n || 3} days of the month`; break;
    case 'wd': s = (w.days || []).length ? w.days.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(x => DOW[x]).join(', ') : 'Any weekday'; break;
    default: s = 'Any day';
  }
  if (w.months?.length) s += ' · ' + w.months.map(m => MON[m - 1]).join(', ');
  return s;
}
const winIsAny = w => !w || ((!w.type || w.type === 'any') && !w.months?.length);

/* ------------------------------------------------------------- identity */
function me() {
  const as = Q.get('as');
  if (as) return { id: as.toUpperCase(), name: Q.get('name') || as.toUpperCase() };
  const m = store.get('me', null);
  return m && m.id ? m : null;
}

/* ------------------------------------------------------------- IndexedDB */
function idbOpen(name, stores) {
  return new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => stores.forEach(s => r.result.objectStoreNames.contains(s) || r.result.createObjectStore(s));
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbDo(db, st, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(st, mode); const q = fn(t.objectStore(st));
    t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const KV = {
  db: null,
  async open() { return this.db ||= idbOpen('monitoring-desk', ['kv']); },
  async get(k) { try { return await idbDo(await this.open(), 'kv', 'readonly', s => s.get(k)); } catch { return undefined; } },
  async set(k, v) { try { await idbDo(await this.open(), 'kv', 'readwrite', s => s.put(v, k)); } catch { } },
  async del(k) { try { await idbDo(await this.open(), 'kv', 'readwrite', s => s.delete(k)); } catch { } },
};
/* Events never change once written, so each machine keeps a local copy and only reads new files. */
const Cache = {
  db: null,
  async open(team) { try { this.db = await idbOpen('md-cache-' + team, ['ev', 'pk']); } catch { this.db = null; } },
  async loadAll() {
    if (!this.db) return [];
    try {
      const keys = await idbDo(this.db, 'ev', 'readonly', s => s.getAllKeys());
      const vals = await idbDo(this.db, 'ev', 'readonly', s => s.getAll());
      return keys.map((k, i) => [k, vals[i]]);

  const id = at.replace(/[-:.]/g, '').replace('Z', '') + '_' + who.id.replace(/[^\w]/g, '').slice(0, 16) + '_' + rand(5);
  const ev = { app: APP, v: SCHEMA, id, at, by: { id: who.id, name: who.name }, ops };

async function loadPacks() {

  let n = 0;
  for await (const [name, h] of pd_.entries()) {
    if (h.kind !== 'file' || !/^\d{4}-\d{2}\.json$/.test(name)) continue;
    try {
      const f = await h.getFile();
      const seen = await Cache.pk(name);
      if (seen && seen.mod === f.lastModified && seen.size === f.size) continue;
      const p = JSON.parse(await f.text());
      if (p.app !== APP || !Array.isArray(p.events)) continue;
      const pairs = [];
      for (const ev of p.events) { const key = ev.at?.slice(0, 7) + '/' + ev.id + '.json'; if (ingest(ev)) n++; DB.files.add(key); pairs.push([key, ev]); }

    months.sort();

        if (h.kind !== 'file' || !n.endsWith('.json') || n.startsWith('~') || n.startsWith('.')) continue;
        const key = m + '/' + n;

        todo.push([key, h]);

      const chunk = todo.slice(i, i + 24);
      const got = await Promise.all(chunk.map(async ([key, h]) => {
        try { const f = await h.getFile(); return [key, JSON.parse(await f.text())]; } catch { return null; /* half-synced: try next time */ }
